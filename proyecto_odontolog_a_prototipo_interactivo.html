<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ODONTO · Proyecto Odontología — Prototipo Sobrinos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block">
<style>
:root{
  --bg:#F9F7F3; --surface:#FFFFFF; --surface-2:#F2ECE4; --surface-3:#E7DFD3;
  --ink:#23201C; --muted:#575048; --subtle:#787067; --line:#EAE3D9; --line-2:#DCD2C4;
  --primary:#2B6B64; --primary-deep:#1D4F49; --primary-ink:#FFFFFF; --primary-soft:#E3F1EF;
  --accent:#D6603F; --accent-deep:#9F3C20; --accent-soft:#FBECE7;
  --blue:#285E8E; --blue-soft:#E5EFF8;
  --mustard:#B87D1E; --mustard-soft:#FDF4E3;
  --ok:#2E7A53; --ok-soft:#E2F2E9; --warn:#B07219; --warn-soft:#FDF2DF; --bad:#C83E37; --bad-soft:#FCE6E5;
  --frame:#1F1D1A; --overlay:rgba(35,32,28,.42);
  --f:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  --r1:6px; --r2:10px; --r3:14px; --r4:18px;
  --sh1:0 1px 3px rgba(60,50,40,.06), 0 3px 10px -2px rgba(60,50,40,.06);
  --sh2:0 12px 28px -8px rgba(60,50,40,.16), 0 4px 10px -2px rgba(60,50,40,.07);
  --sh3:0 24px 60px -16px rgba(35,32,28,.35);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--f); font-size:14.5px; line-height:1.48; -webkit-font-smoothing:antialiased; padding-left:248px}
h1,h2,h3,h4{margin:0; font-weight:750; letter-spacing:-.02em}
h1{font-size:28px; line-height:1.15} h2{font-size:18px} h3{font-size:15.5px} h4{font-size:13.5px}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .subtle{color:var(--subtle)}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--subtle)}
.ms{font-family:"Material Symbols Rounded"; font-weight:normal; font-style:normal; font-size:20px; line-height:1; display:inline-block; vertical-align:middle; user-select:none; font-variation-settings:'FILL' 0,'wght' 450,'GRAD' 0,'opsz' 24; flex:none}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}

/* Barra lateral */
.side{position:fixed; top:0; left:0; bottom:0; width:248px; z-index:40; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:20px; padding:18px 14px; overflow-y:auto}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px}
.logo{width:38px; height:38px; border-radius:var(--r2); background:var(--primary); color:var(--primary-ink); display:grid; place-items:center; font-weight:800; font-size:13px; letter-spacing:.04em; flex:none}
.brand b{display:block; font-size:15px; line-height:1.15}
.brand span{font-size:11.5px; color:var(--muted)}
.nav{display:flex; flex-direction:column; gap:18px}
.ngrp{display:flex; flex-direction:column; gap:3px}
.nav .grp{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--subtle); padding:0 12px 5px}
.nav button{display:flex; gap:11px; align-items:center; width:100%; border:0; background:none; padding:10px 12px; border-radius:var(--r2); color:var(--muted); font-weight:600; font-size:14px; text-align:left; transition:background .18s, color .18s}
.nav button:hover{background:var(--surface-2); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--primary-soft); color:var(--primary-deep); font-weight:700}
.side-foot{margin-top:auto; padding:10px 12px; border-radius:var(--r2); background:var(--surface-2); font-size:12px}
.proto{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-deep); background:var(--accent-soft); padding:3px 7px; border-radius:var(--r1)}

/* Header superior */
.top{position:sticky; top:0; z-index:30; background:rgba(255,255,255,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.wrap{max-width:1360px; margin:0 auto; padding:0 22px}
.top-row{display:flex; align-items:center; gap:12px; padding:10px 0; flex-wrap:wrap}
.top-brand{display:none}
.gsearch{position:relative; flex:1; max-width:360px}
.gsearch .ms{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--subtle); font-size:19px}
.gsearch input{width:100%; height:38px; border:1px solid var(--line-2); background:var(--bg); border-radius:var(--r2); padding:0 12px 0 38px; font-size:13.5px}
.gsearch input:focus{outline:none; border-color:var(--primary); background:var(--surface)}
.role-bar{display:flex; align-items:center; gap:6px; margin-left:auto; background:var(--surface-2); padding:3px; border-radius:var(--r2)}
.role-bar button{border:0; background:none; padding:6px 10px; border-radius:var(--r1); font-size:12.5px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:5px}
.role-bar button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--sh1)}
.iconbtn{position:relative; width:38px; height:38px; border-radius:var(--r2); border:1px solid var(--line-2); background:var(--surface); display:grid; place-items:center; color:var(--muted)}
.iconbtn:hover{background:var(--surface-2); color:var(--ink)}
.count{position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:var(--accent); color:#fff; font-size:10.5px; font-weight:800; display:grid; place-items:center}

/* Estructura general */
main{padding:24px 0 80px}
.view{display:none; animation:fadeIn .25s var(--ease)}
.view.on{display:block}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.vhead{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:20px}
.vhead p{color:var(--muted); margin-top:5px; max-width:65ch}
.vhead .eyebrow{color:var(--primary); display:flex; align-items:center; gap:5px; margin-bottom:6px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.grid{display:grid; gap:16px}
.g-2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r4); padding:18px; box-shadow:var(--sh1)}
.chead{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.chead p{color:var(--muted); font-size:13px; margin-top:2px}

/* Botones y chips */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:38px; padding:0 14px; border-radius:var(--r2); border:1px solid var(--line-2); background:var(--surface); font-weight:600; font-size:13.5px; white-space:nowrap; transition:all .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45; pointer-events:none}
.btn.pri{background:var(--primary); border-color:var(--primary); color:var(--primary-ink)}
.btn.pri:hover{background:var(--primary-deep)}
.btn.acc{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{border-color:transparent; background:none; color:var(--primary-deep)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.sm{height:30px; padding:0 10px; font-size:12.5px; border-radius:var(--r1)}
.btn.lg{height:46px; padding:0 18px; font-size:15px; border-radius:var(--r3)}
.btn.block{width:100%}
.chip{display:inline-flex; align-items:center; gap:4px; height:24px; padding:0 8px; border-radius:var(--r1); font-size:12px; font-weight:700; white-space:nowrap}
.chip .ms{font-size:15px}
.chip.ok{background:var(--ok-soft); color:var(--ok)}
.chip.warn{background:var(--warn-soft); color:var(--warn)}
.chip.bad{background:var(--bad-soft); color:var(--bad)}
.chip.neu{background:var(--surface-2); color:var(--muted)}
.chip.acc{background:var(--accent-soft); color:var(--accent-deep)}
.chip.blue{background:var(--blue-soft); color:var(--blue)}

/* KPIs */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
.kpi .ic{width:38px; height:38px; border-radius:var(--r2); display:grid; place-items:center}
.kpi .v{font-size:28px; font-weight:800; margin-top:12px; line-height:1.1}
.kpi .l{font-size:13.5px; color:var(--muted); margin-top:3px}
.kpi .d{font-size:12.5px; font-weight:600; margin-top:10px; display:flex; align-items:center; gap:4px}

/* Listas */
.li{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line)}
.li:first-child{border-top:0; padding-top:2px}
.li .grow{flex:1; min-width:0}
.li .grow b{display:block; font-size:14px}
.li .grow small{display:block; color:var(--muted); font-size:12.5px}
.av{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:12.5px; flex:none; background:var(--surface-2); color:var(--muted)}
.av.pat{background:var(--primary-soft); color:var(--primary-deep)}
.inp{width:100%; height:38px; border:1px solid var(--line-2); background:var(--surface); border-radius:var(--r2); padding:0 11px; font-size:13.5px}
textarea.inp{height:auto; min-height:76px; padding:8px 11px; resize:vertical}

/* Grilla de Sillones */
.cal-wrap{overflow-x:auto}
.cal{display:grid; grid-template-columns:64px repeat(5,minmax(155px,1fr)); min-width:840px}
.cal .hd{background:var(--surface-2); padding:10px; font-size:12.5px; font-weight:700; border-bottom:1px solid var(--line); border-left:1px solid var(--line)}
.cal .hd small{display:block; font-weight:500; color:var(--subtle); font-size:11px; margin-top:2px}
.cal .hr{padding:10px 8px; font-size:12px; font-weight:700; color:var(--subtle); border-top:1px solid var(--line)}
.cal .sl{border-top:1px solid var(--line); border-left:1px solid var(--line); padding:5px; min-height:78px}
.tn{width:100%; height:100%; border:0; border-radius:var(--r2); padding:7px 9px; text-align:left; display:flex; flex-direction:column; gap:3px; position:relative; border-left:4px solid var(--primary); background:var(--primary-soft); transition:transform .15s, box-shadow .15s}
.tn:hover{transform:translateY(-2px); box-shadow:var(--sh2)}
.tn.sel{outline:2px solid var(--ink)}
.tn b{font-size:13px; color:var(--ink)}
.tn small{font-size:11.5px; color:var(--muted)}
.free-sl{width:100%; height:100%; min-height:66px; border:1.5px dashed var(--line-2); border-radius:var(--r2); background:none; color:var(--subtle); font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:4px}
.free-sl:hover{border-color:var(--primary); color:var(--primary-deep); background:var(--primary-soft)}

/* Layout Legajo + Odontograma */
.leg-grid{display:grid; grid-template-columns:260px minmax(0,1fr); gap:16px; align-items:start}
.plist{display:flex; flex-direction:column; gap:4px; max-height:620px; overflow-y:auto}
.prow{display:flex; gap:10px; align-items:flex-start; width:100%; padding:10px; border:0; border-radius:var(--r2); background:none; text-align:left}
.prow:hover{background:var(--surface-2)}
.prow[aria-current="true"]{background:var(--primary-soft)}
.prow b{display:block; font-size:14px}
.prow small{display:block; font-size:12px; color:var(--muted)}
.med-alerts{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin:16px 0; overflow-x:auto}
.tabs button{border:0; background:none; padding:10px 14px; font-weight:700; font-size:13.5px; color:var(--muted); border-bottom:2.5px solid transparent; display:flex; align-items:center; gap:6px; white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary-deep); border-bottom-color:var(--primary)}

/* ===== ODONTOGRAMA INTERACTIVO + PLAN DE 20 ÍTEMS (PLANILLA 1 DIGITAL) ===== */
.odonto-split{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:18px; align-items:start}
.tool-palette{display:flex; gap:6px; flex-wrap:wrap; padding:10px; background:var(--surface-2); border-radius:var(--r3); margin-bottom:14px}
.tool-btn{border:1.5px solid var(--line-2); background:var(--surface); border-radius:var(--r2); padding:6px 10px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px; transition:all .15s}
.tool-btn[aria-pressed="true"]{border-color:var(--ink); box-shadow:0 0 0 2px var(--ink)}
.tool-dot{width:12px; height:12px; border-radius:3px; display:inline-block}

.arch-box{border:1px solid var(--line); border-radius:var(--r3); padding:14px 10px; background:var(--bg); overflow-x:auto}
.quad-row{display:grid; grid-template-columns:1fr 2px 1fr; gap:10px; align-items:center; min-width:540px}
.quad-div{background:var(--line-2); height:100%; width:2px}
.quad-hdiv{height:2px; background:var(--line-2); margin:12px 0; min-width:540px}
.teeth-grp{display:flex; justify-content:center; gap:5px}

/* Cada Diente SVG / Geométrico de 5 Caras */
.tooth-card{display:flex; flex-direction:column; align-items:center; gap:3px; padding:3px; border-radius:var(--r1); cursor:pointer; user-select:none; transition:background .15s}
.tooth-card:hover{background:var(--surface-2)}
.tooth-card.sel{background:var(--primary-soft); outline:1.5px solid var(--primary)}
.tooth-num{font-size:11.5px; font-weight:800; color:var(--muted)}
.tooth-svg{width:38px; height:38px; display:block}
.tooth-svg polygon, .tooth-svg rect{stroke:#787067; stroke-width:1.4; fill:#FFFFFF; transition:fill .15s}
.tooth-svg polygon:hover, .tooth-svg rect:hover{filter:brightness(.92)}
.tooth-svg .f-caries{fill:#E04F44 !important}
.tooth-svg .f-realizado{fill:#3474B4 !important}
.tooth-svg .f-presup{fill:#2E8B63 !important}
.tooth-badge{font-size:10px; font-weight:800; height:16px; padding:0 4px; border-radius:4px; display:flex; align-items:center; justify-content:center}

/* Lista de los 20 Ítems de la Planilla 1 */
.plan20-list{max-height:540px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--r3); divide-y:1px solid var(--line)}
.p20-row{display:grid; grid-template-columns:28px minmax(0,1fr) auto 92px; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); font-size:13px; transition:background .2s}
.p20-row.active{background:var(--primary-soft); font-weight:700}
.p20-num{color:var(--subtle); font-weight:700; font-size:12px}
.qty-ctrl{display:inline-flex; align-items:center; border:1px solid var(--line-2); border-radius:var(--r1); background:var(--surface)}
.qty-ctrl button{border:0; background:none; width:24px; height:24px; font-weight:800; color:var(--muted); padding:0}
.qty-ctrl button:hover{background:var(--surface-2); color:var(--ink)}
.qty-ctrl span{min-width:22px; text-align:center; font-size:12.5px; font-weight:700}

/* ===== EXAMEN ESTOMATOLÓGICO E ÍNDICE IHOS (PLANILLA 2 DIGITAL) ===== */
.estoma-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.estoma-item{border:1.5px solid var(--line); border-radius:var(--r3); padding:11px 14px; background:var(--surface); transition:all .2s}
.estoma-item.abn{border-color:var(--warn); background:var(--warn-soft)}
.ihos-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:420px}
.ihos-cell{border:1.5px solid var(--line-2); border-radius:var(--r2); padding:8px; background:var(--surface); text-align:center}
.ihos-cell b{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
.ihos-btns{display:grid; grid-template-columns:repeat(4,1fr); gap:3px}
.ihos-btns button{border:1px solid var(--line-2); background:var(--bg); border-radius:4px; height:26px; font-weight:700; font-size:12px; padding:0}
.ihos-btns button[aria-pressed="true"]{background:var(--primary); color:#fff; border-color:var(--primary)}

/* Simulador de Celular */
.stage{display:grid; grid-template-columns:390px minmax(0,1fr); gap:36px; align-items:start}
.phone{width:100%; max-width:390px; background:var(--frame); border-radius:42px; padding:10px; box-shadow:var(--sh3)}
.screen{background:var(--bg); border-radius:33px; height:760px; overflow:hidden; display:flex; flex-direction:column; position:relative}
.sbar{display:flex; justify-content:space-between; align-items:center; padding:12px 24px 6px; font-size:12px; font-weight:700}
.sbar .isl{width:88px; height:22px; border-radius:12px; background:var(--frame)}
.sbody{flex:1; overflow-y:auto; padding:8px 16px 24px; display:flex; flex-direction:column; gap:12px}
.mcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r3); padding:14px}
.sig-canvas{width:100%; height:135px; border:1.5px dashed var(--line-2); border-radius:var(--r2); background:#fff; touch-action:none; cursor:crosshair}

/* Notificación flotante Sala de Espera + Toast */
.pings{position:fixed; top:68px; right:20px; z-index:90; width:min(380px, calc(100% - 32px)); display:flex; flex-direction:column; gap:10px}
.ping{display:flex; gap:12px; padding:15px; background:var(--surface); border:2px solid var(--mustard); border-radius:var(--r4); box-shadow:var(--sh3); animation:fadeIn .3s}
.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:10px 16px; border-radius:var(--r3); display:flex; gap:8px; align-items:center; font-weight:600; font-size:13.5px; opacity:0; pointer-events:none; transition:all .25s; z-index:95; box-shadow:var(--sh3)}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* Drawer modal */
.scrim{position:fixed; inset:0; background:var(--overlay); opacity:0; pointer-events:none; transition:opacity .25s; z-index:70}
.scrim.on{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(460px,100%); background:var(--surface); box-shadow:var(--sh3); z-index:71; transform:translateX(102%); transition:transform .3s var(--ease); display:flex; flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line)}
.drawer .db{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px}
.drawer .df{padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:8px}

/* Adaptabilidad Mobile */
@media (max-width:1120px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2,.g-2e,.odonto-split,.stage{grid-template-columns:minmax(0,1fr)}
  .leg-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  body{padding-left:0; padding-bottom:74px}
  .side{top:auto; right:0; width:100%; flex-direction:row; padding:6px 8px; border-right:0; border-top:1px solid var(--line); box-shadow:0 -6px 20px rgba(0,0,0,.08)}
  .side .brand,.side-foot,.nav .grp{display:none}
  .nav{flex-direction:row; width:100%; gap:2px; overflow-x:auto}
  .ngrp{display:contents}
  .nav button{flex:1 0 64px; flex-direction:column; gap:3px; padding:6px 4px; font-size:11px; text-align:center; justify-content:center}
  .top-brand{display:flex}
  .estoma-grid{grid-template-columns:minmax(0,1fr)}
  .toast{bottom:84px}
}
</style>
</head>
<body>

<!-- BARRA LATERAL (En Mobile pasa a Barra Inferior App) -->
<aside class="side">
  <div class="brand">
    <span class="logo">ODO</span>
    <div>
      <b>Proyecto Odontología</b>
      <span>Clínica Dental · Demo MDP</span>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="Navegación principal">
    <div class="ngrp">
      <span class="grp">Día a día</span>
      <button data-v="tablero" aria-current="page"><span class="ms">space_dashboard</span><span>Tablero</span></button>
      <button data-v="sillones"><span class="ms">chair</span><span>Sillones y Agenda</span></button>
      <button data-v="legajo"><span class="ms">clinical_notes</span><span>Pacientes y Ficha</span></button>
    </div>
    <div class="ngrp">
      <span class="grp">Gestión y Auditoría</span>
      <button data-v="obras"><span class="ms">receipt_long</span><span>Obras Sociales</span></button>
    </div>
    <div class="ngrp">
      <span class="grp">Celular e IA</span>

/* =========================================================================
   MOTOR DE CONEXIÓN VIVA: ODONTOGRAMA -> PLAN DE 20 ÍTEMS (PLANILLA 1)
   ========================================================================= */
function computePlan20(p){
  const counts = {};
  PLAN20_CATALOG.forEach(it => counts[it.id] = p.extraItems[it.id] || 0);

  // Recorrer piezas del odontograma para calcular ítems 5 a 14 y 18 automáticamente
  Object.entries(p.teeth).forEach(([tNum, data]) => {
    const num = +tNum;
    const isChild = num >= 51;
    const isAnterior = [13,12,11,21,22,23,43,42,41,31,32,33,53,52,51,61,62,63,83,82,81,71,72,73].includes(num);

    // Contar caras con caries/a realizar ('caries')
    const facesCaries = ['V','P','M','D','O'].filter(f => data[f] === 'caries').length;
    if(facesCaries === 1) counts[6] = (counts[6]||0) + 1;      // 6. Resina simple (1 cara)
    else if(facesCaries === 2) counts[7] = (counts[7]||0) + 1; // 7. Resina compuesta (2 caras)
    else if(facesCaries >= 3) counts[8] = (counts[8]||0) + 1;  // 8. Resina compleja (3+ caras)

    // Tratamientos de pieza entera
    if(data.whole === 'extraccion_pend') counts[5] = (counts[5]||0) + 1;
    if(data.whole === 'endo_pend'){
      if(isChild) counts[11] = (counts[11]||0) + 1; // 11. Pulpotomía
      else if(isAnterior) counts[9] = (counts[9]||0) + 1; // 9. End. Ant.
      else counts[10] = (counts[10]||0) + 1; // 10. End. Post.
    }
    if(data.whole === 'corona_pend') counts[14] = (counts[14]||0) + 1; // 14. Corona
    if(data.whole === 'sellante_pend') counts[18] = (counts[18]||0) + 1; // 18. Sellantes
  });

  let totalBruto = 0, totalOS = 0, totalPaciente = 0;
  const rows = PLAN20_CATALOG.map(it => {
    const qty = counts[it.id] || 0;
    const sub = qty * it.price;
    const covFactor = p.os.startsWith('Particular') ? 0 : it.osCov;
    const osPay = sub * covFactor;
    const patPay = sub - osPay;
    totalBruto += sub;
    totalOS += osPay;
    totalPaciente += patPay;
    return {...it, qty, sub, osPay, patPay};
  });

  return {rows, totalBruto, totalOS, totalPaciente};
}

/* =========================================================================
   CÁLCULO AUTOMÁTICO DEL ÍNDICE IHOS (PLANILLA 2)
   ========================================================================= */
function computeIHOS(p){
  const pdbAvg = p.ihos.pdb.reduce((a,b)=>a+b,0) / 6;
  const pddAvg = p.ihos.pdd.reduce((a,b)=>a+b,0) / 6;
  const total = +(pdbAvg + pddAvg).toFixed(2);
  let k = 'ok', label = 'Bueno (0.0 a 1.2) · Higiene adecuada';
  if(total > 3.0){ k = 'bad'; label = 'Deficiente (3.1 a 6.0) · Requiere Destartraje urgente'; }
  else if(total > 1.2){ k = 'warn'; label = 'Regular (1.3 a 3.0) · Indicar Profilaxis y técnica de cepillado'; }
  return {pdbAvg:pdbAvg.toFixed(2), pddAvg:pddAvg.toFixed(2), total, k, label};
}

/* ----- PESTAÑA 1: ODONTOGRAMA + PLAN DE TRATAMIENTO DE 20 ÍTEMS CONECTADOS ----- */
function renderToothSVG(p, num){
  const d = p.teeth[num] || {};
  const fc = f => d[f]==='caries' ? 'f-caries' : d[f]==='realizado' ? 'f-realizado' : '';
  let badge = '';
  if(d.whole==='endo_pend') badge = `<span class="tooth-badge" style="background:var(--bad-soft);color:var(--bad)">ENDO</span>`;
  else if(d.whole==='corona_pend') badge = `<span class="tooth-badge" style="background:var(--warn-soft);color:var(--warn)">COR</span>`;
  else if(d.whole==='extraccion_pend') badge = `<span class="tooth-badge" style="background:var(--bad);color:#fff">EXTR</span>`;
  else if(d.whole==='sellante_pend') badge = `<span class="tooth-badge" style="background:var(--ok-soft);color:var(--ok)">SELL</span>`;
  else if(d.whole==='ausente') badge = `<span class="tooth-badge" style="background:var(--surface-3);color:var(--muted)">AUS</span>`;
  else badge = `<span class="tooth-badge" style="opacity:0">-</span>`;

  const isAus = d.whole==='ausente' || d.whole==='extraccion_pend';
  return `
    <div class="tooth-card ${p.selTooth===num?'sel':''}" data-act="sel-tooth" data-num="${num}">
      <span class="tooth-num num">${num}</span>
      <svg class="tooth-svg" viewBox="0 0 40 40" style="${isAus?'opacity:.45':''}">
        <!-- Vestibular (Arriba) -->
        <polygon points="2,2 38,2 28,12 12,12" class="${fc('V')}" data-act="tooth-face" data-num="${num}" data-f="V"><title>Pieza ${num} · Cara Vestibular</title></polygon>
        <!-- Palatina / Lingual (Abajo) -->
        <polygon points="12,28 28,28 38,38 2,38" class="${fc('P')}" data-act="tooth-face" data-num="${num}" data-f="P"><title>Pieza ${num} · Cara Palatina/Lingual</title></polygon>
        <!-- Mesial (Izquierda) -->
        <polygon points="2,2 12,12 12,28 2,38" class="${fc('M')}" data-act="tooth-face" data-num="${num}" data-f="M"><title>Pieza ${num} · Cara Mesial</title></polygon>
        <!-- Distal (Derecha) -->
        <polygon points="28,12 38,2 38,38 28,28" class="${fc('D')}" data-act="tooth-face" data-num="${num}" data-f="D"><title>Pieza ${num} · Cara Distal</title></polygon>
        <!-- Oclusal / Incisal (Centro) -->
        <rect x="12" y="12" width="16" height="16" class="${fc('O')}" data-act="tooth-face" data-num="${num}" data-f="O"><title>Pieza ${num} · Cara Oclusal/Incisal</title></rect>
        ${d.whole==='extraccion_pend' ? `<line x1="4" y1="4" x2="36" y2="36" stroke="#C83E37" stroke-width="3.5"/><line x1="36" y1="4" x2="4" y2="36" stroke="#C83E37" stroke-width="3.5"/>` : ''}
        ${d.whole==='ausente' ? `<line x1="4" y1="20" x2="36" y2="20" stroke="#575048" stroke-width="3"/>` : ''}
        ${d.whole==='corona_pend' ? `<circle cx="20" cy="20" r="16" fill="none" stroke="#D6603F" stroke-width="3"/>` : ''}
      </svg>
      ${badge}
    </div>
  `;
}

/* ----- PESTAÑA 3: VISOR DE PLACA DENTAL SCAN + EVOLUCIONES ----- */
function renderTabPlacas(p){
  return `
    <div class="grid g-2">
      <div>
        <div class="chead">
          <div>
            <h3>Estudio recibido de Dental Scan (La Rioja 3501)</h3>
            <p>${p.dentalScan.estudio} · ${p.dentalScan.fecha}</p>
          </div>
          <span class="chip ok">${ico('link')}Abrochado a facturación</span>
        </div>

        <!-- Radiografía Panorámica Simulada de Alto Contraste -->
        <div style="background:#0e1318; border-radius:var(--r3); padding:16px; color:#d0e2f2; position:relative; overflow:hidden; border:2px solid #2b3947">
          <div class="row" style="justify-content:space-between; font-size:11.5px; opacity:.8; margin-bottom:8px">
            <span>DENTAL SCAN S.R.L. · MAR DEL PLATA</span>
            <span class="num">PACIENTE: ${p.n.toUpperCase()} · DNI ${p.dni}</span>
          </div>
          <svg viewBox="0 0 600 230" style="width:100%; height:auto; display:block; filter:drop-shadow(0 0 8px rgba(140,200,255,.25))">
            <rect width="600" height="230" fill="#090d11" rx="8"/>
            <!-- Curva mandibular y maxilar -->
            <path d="M 60 45 Q 300 95 540 45" fill="none" stroke="#3a4f63" stroke-width="26" stroke-linecap="round" opacity=".5"/>
            <path d="M 45 95 Q 300 205 555 95" fill="none" stroke="#476078" stroke-width="32" stroke-linecap="round" opacity=".55"/>
            <!-- Dientes superiores e inferiores estilizados en Rx -->
            ${Array.from({length:14}, (_,i)=>{
              const x = 95 + i*31;
              const yTop = 58 + Math.sin((i/13)*Math.PI)*18;
              const yBot = 122 + Math.sin((i/13)*Math.PI)*24;
              const isAlert = (i===2 || i===10);
              return `
                <g opacity=".9">
                  <rect x="${x}" y="${yTop}" width="18" height="24" rx="5" fill="${isAlert?'#fff':'#b8cde0'}"/>
                  <path d="M ${x+4} ${yTop} L ${x+6} ${yTop-18} M ${x+14} ${yTop} L ${x+12} ${yTop-18}" stroke="${isAlert?'#ff7b72':'#8aa8c4'}" stroke-width="3" stroke-linecap="round"/>
                  ${isAlert ? `<circle cx="${x+9}" cy="${yTop-20}" r="9" fill="none" stroke="#ff7b72" stroke-width="2" stroke-dasharray="3 2"/>` : ''}
                  <rect x="${x}" y="${yBot}" width="18" height="24" rx="5" fill="#b8cde0"/>
                  <path d="M ${x+5} ${yBot+24} L ${x+7} ${yBot+42} M ${x+13} ${yBot+24} L ${x+11} ${yBot+42}" stroke="#8aa8c4" stroke-width="3" stroke-linecap="round"/>
                </g>
              `;
            }).join('')}
          </svg>
          <div class="row" style="justify-content:space-between; margin-top:10px; font-size:12px">
            <span style="color:#8cd4ff">${ico('info')}Informe: ${p.dentalScan.obs}</span>
            <button class="btn sm" style="background:#1c2836;color:#fff;border-color:#384d63" data-act="orden-dentalscan">${ico('add_circle')}Pedir nueva orden a Dental Scan</button>
          </div>
        </div>
      </div>

      <div>
        <div class="chead">
          <div>
            <h3>Historial de Evoluciones por Pieza y Código</h3>
            <p>Cada prestación registra pieza, código del nomenclador y firma del paciente</p>
          </div>
          <button class="btn sm pri" data-v-go="manoslibres">${ico('mic')}Cargar por Voz IA</button>
        </div>
        ${p.evol.map(e => `
          <div style="border:1px solid var(--line); border-left:4px solid var(--primary); border-radius:var(--r2); padding:12px; margin-bottom:10px">
            <div class="row" style="justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px">
              <span><b>${e.d}</b> · ${e.pro} (${e.esp})</span>
              <span class="chip ok" style="height:20px">${ico('draw')}Firmado</span>
            </div>
            <div class="row" style="gap:6px; margin-bottom:6px">
              <span class="chip blue">Pieza ${e.pza}</span>
              <span class="chip neu">Código ${e.code}</span>
            </div>
            <p style="font-size:13.5px">${e.t}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

        <p class="muted" style="font-size:12px; margin:8px 0">La IA detectó a mano alzada: <b>Pieza 16 (Endo Post.)</b>, <b>Pieza 24 (Corona)</b> e <b>IHOS = 2.5</b>.</p>

function drawPaperOdontoCanvas(){
  const c = $('#paper-canvas');
  if(!c) return;
  const x = c.getContext('2d');
  x.fillStyle = '#fdfaf2'; x.fillRect(0,0,320,230);
  x.fillStyle = '#2B6B64'; x.fillRect(0,0,320,32);
  x.fillStyle = '#fff'; x.font = 'bold 12px "Plus Jakarta Sans", sans-serif';
  x.fillText('PLANILLA ODONTOGRAMA Y PRESUPUESTO', 12, 20);
  // Dibujar dientitos y marcas en birome azul/roja
  for(let i=0;i<8;i++){
    const tx = 18 + i*36, ty = 52;
    x.strokeStyle = '#666'; x.lineWidth = 1;
    x.strokeRect(tx, ty, 24, 24);
    x.strokeRect(tx+6, ty+6, 12, 12);
    x.fillStyle = '#555'; x.font = '10px sans-serif';
    x.fillText(String(18-i), tx+6, ty-4);
    if(i===2){ // Pieza 16 marcada en rojo
      x.fillStyle = 'rgba(220,50,40,.75)';
      x.fillRect(tx+6, ty+6, 12, 12);
    }
    if(i===5){ // Cruz en birome
      x.strokeStyle = '#1e40af'; x.lineWidth = 2.2;
      x.beginPath(); x.moveTo(tx,ty); x.lineTo(tx+24,ty+24); x.moveTo(tx+24,ty); x.lineTo(tx,ty+24); x.stroke();
    }
  }
  x.fillStyle = '#1e3a8a'; x.font = '20px "Caveat", cursive';
  x.fillText('7. Resina compuesta x2  --> $128.000', 16, 122);
  x.fillText('10. End. Post (Pza 16)  --> $185.000', 16, 150);
  x.fillText('Obs: Encía inflamada - Pedir Panorámica', 16, 185);
}

function initSignaturePad(){
  const c = $('#sig-pad');
  if(!c) return;
  const r = c.getBoundingClientRect();
  c.width = r.width; c.height = r.height;
  const ctx = c.getContext('2d');
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#1D4F49';
  let drawing = false;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.addEventListener('pointerdown', e => { drawing = true; c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); });
  c.addEventListener('pointermove', e => { if(!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); });
  c.addEventListener('pointerup', () => { drawing = false; });
}

/* =========================================================================
   CONTROLADOR DE EVENTOS Y ACCIONES INTERACTIVAS
   ========================================================================= */
function goView(v){
  S.view = v;
  $$('.view').forEach(el => el.classList.toggle('on', el.id === 'v-'+v));
  $$('#nav [data-v]').forEach(b => b.setAttribute('aria-current', b.dataset.v===v ? 'page' : 'false'));
  R[v]();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.addEventListener('click', e => {
  const navBtn = e.target.closest('#nav [data-v]');
  if(navBtn){ goView(navBtn.dataset.v); return; }

  const vGo = e.target.closest('[data-v-go]');
  if(vGo){ goView(vGo.dataset.vGo); return; }

  const actEl = e.target.closest('[data-act]');
  if(!actEl) return;
  const act = actEl.dataset.act;
  const p = patById(S.pid);

  if(act === 'close-drawer'){ closeDrawer(); return; }

  if(act === 'set-role'){
    S.role = actEl.dataset.r;
    $$('[data-act="set-role"]').forEach(b => b.setAttribute('aria-pressed', b===actEl));
    const labels = {dir:'Vista Dirección: acceso total a métricas, sillones y facturación', sec:'Vista Recepción: sala de espera, presupuestos y cobros', pro:'Vista Odontólogo: ficha clínica, odontograma y modo manos libres'};
    toast(labels[S.role], 'switch_account');
    return;
  }

  if(act === 'go-odonto'){ S.legTab = 'odonto'; goView('legajo'); return; }
  if(act === 'open-pat'){ S.pid = actEl.dataset.pid; S.legTab = 'odonto'; goView('legajo'); return; }
  if(act === 'open-pat-tab'){ S.pid = actEl.dataset.pid; S.legTab = actEl.dataset.tab; goView('legajo'); return; }
  if(act === 'select-pat'){ S.pid = actEl.dataset.pid; R.legajo(); return; }
  if(act === 'leg-tab'){ S.legTab = actEl.dataset.t; R.legajo(); return; }

  if(act === 'pick-turn'){ S.selTurn = actEl.dataset.tid; R.sillones(); return; }

  /* Interacción con el Odontograma y las 5 caras */
  if(act === 'set-dent'){
    p.dent = actEl.dataset.d;
    p.selTooth = p.dent==='adult' ? 16 : 55;
    R.legajo();
    return;
  }
  if(act === 'pick-tool'){
    S.tool = actEl.dataset.k;
    R.legajo();
    return;
  }
  if(act === 'sel-tooth' && !e.target.closest('[data-act="tooth-face"]')){
    p.selTooth = +actEl.dataset.num;
    R.legajo();
    return;
  }
  if(act === 'tooth-face'){
    e.stopPropagation();
    const num = +actEl.dataset.num;
    const face = actEl.dataset.f;
    p.selTooth = num;
    if(!p.teeth[num]) p.teeth[num] = {};

    if(S.tool === 'clear'){
      delete p.teeth[num];
      toast(`Pieza ${num} limpia · Presupuesto recalculado`, 'ink_eraser');
    } else if(['caries','realizado'].includes(S.tool)){
      p.teeth[num][face] = p.teeth[num][face] === S.tool ? null : S.tool;
      const facesCount = ['V','P','M','D','O'].filter(f => p.teeth[num][f]==='caries').length;
      const itemAuto = facesCount===1 ? '6. Resina simple' : facesCount===2 ? '7. Resina compuesta' : facesCount>=3 ? '8. Resina compleja' : 'actualizado';
      toast(`Pieza ${num} (Cara ${face}) marcada · Sumado a ${itemAuto}`, 'dentistry');
    } else {
      p.teeth[num].whole = p.teeth[num].whole === S.tool ? null : S.tool;
      toast(`Tratamiento aplicado en Pieza ${num} · Presupuesto actualizado`, 'Calculate');
    }
    R.legajo();
    return;
  }

  /* Botones +/- de la lista de 20 ítems del presupuesto */
  if(act === 'p20-delta' || act === 'p20- delta'){
    const id = +actEl.dataset.id;
    const d = +actEl.dataset.d;
    p.extraItems[id] = Math.max(0, (p.extraItems[id]||0) + d);
    R.legajo();
    return;
  }

  /* Examen Estomatológico (Planilla 2) */
  if(act === 'toggle-estoma'){
    const k = actEl.dataset.k;
    p.estoma[k].ok = !p.estoma[k].ok;
    R.legajo();
    return;
  }
  if(act === 'estoma-sug'){
    const k = actEl.dataset.k;
    p.estoma[k].obs = actEl.dataset.v;
    R.legajo();
    toast('Hallazgo clínico agregado al Examen Estomatológico', 'fact_check');
    return;
  }

  /* Índice IHOS (Planilla 2) */
  if(act === 'set-ihos'){
    const type = actEl.dataset.type;
    const i = +actEl.dataset.i;
    const v = +actEl.dataset.v;
    p.ihos[type][i] = v;
    R.legajo();
    return;
  }
  if(act === 'ihos-add-limpieza'){
    p.extraItems[2] = (p.extraItems[2]||0) + 1;
    S.legTab = 'odonto';
    R.legajo();
    toast('Ítem «2. Destartraje + Profilaxis» sumado al Presupuesto de ' + p.n, 'add_task');
    return;
  }

  /* Orden Digital para Dental Scan */
  if(act === 'orden-dentalscan'){
    openDrawer('Nueva Orden Digital · Dental Scan MDP', `
      <p class="muted">Reemplaza el talonario de papel de Dental Scan (La Rioja 3501). El paciente recibe la orden autorizada en su WhatsApp y el estudio vuelve directo a este legajo.</p>
      <div><label class="eyebrow">Paciente</label><input class="inp" value="${p.n} · DNI ${p.dni} (${p.os})" readonly></div>
      <div><label class="eyebrow">Estudio solicitado</label>
        <select class="inp" id="ds-est">
          <option>Ortopantomografía (Panorámica Digital)</option>
          <option>Tomografía Cone Beam 3D (Sector / Maxilar)</option>
          <option>Teleradiografía Lateral + Trazado Cefalométrico</option>
          <option>Seriada Periapical Completa</option>
        </select>
      </div>
      <div><label class="eyebrow">Pieza / Zona de interés clínico</label><input class="inp" value="Evaluación Pieza ${p.selTooth} y control general"></div>
    `, `<button class="btn" data-act="close-drawer">Cancelar</button><button class="btn pri" style="flex:1" data-act="send-dentalscan">${ico('send')}Enviar Orden Digital al Paciente</button>`);
    return;
  }
  if(act === 'send-dentalscan'){
    closeDrawer();
    toast('Orden digital de Dental Scan enviada por WhatsApp a ' + p.n, 'radiology');
    return;
  }

  /* Simulador de Sala de Espera ("Llegó") */
  if(act === 'sim-sala'){
    const box = $('#pings');
    box.innerHTML = `
      <div class="ping">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--mustard-soft);color:var(--mustard);display:grid;place-items:center;flex:none">
          ${ico('chair','fill')}
        </div>
        <div style="flex:1">
          <small class="subtle" style="font-weight:700">Recepción · Ahora mismo</small>
          <b style="display:block;font-size:16px;margin-top:2px">${p.n} llegó a Sala</b>
          <p class="muted" style="font-size:13px;margin:4px 0 10px">Turno de Sillón 3 · 🟢 Corona de Laboratorio ya recibida en gaveta · ⚠️ Alergia a Penicilina.</p>
          <div class="row">
            <button class="btn pri sm" data-act="ping-ok">${ico('directions_walk')}Hacer pasar al Sillón</button>
            <button class="btn sm" data-act="ping-ok">En 5 minutos</button>
          </div>
        </div>
      </div>
    `;
    return;
  }
  if(act === 'ping-ok'){
    $('#pings').innerHTML = '';
    toast('Recepción notificada: el paciente ya pasa al sillón', 'check_circle');
    return;
  }

  /* Modo Manos Libres IA */
  if(act === 'ia-mode'){
    S.iaMode = actEl.dataset.m;
    R.manoslibres();
    return;
  }
  if(act === 'start-voice-ia'){
    S.iaPhase = 'rec';
    S.iaTranscript = '';
    R.manoslibres();
    setTimeout(() => {
      S.iaPhase = 'done';
      S.iaTranscript = 'Paciente en sillón. En pieza 26 se observa caries ocluso-mesial profunda, presupuestar resina compuesta código 02.02. Encía con leve inflamación marginal. Pedir control en 6 meses.';
      R.manoslibres();
      toast('Audio clínico transcripto y estructurado por IA', 'auto_awesome');
    }, 1100);
    return;
  }
  if(act === 'apply-ia-to-odonto'){
    if(!p.teeth[26]) p.teeth[26] = {};
    p.teeth[26].O = 'caries';
    p.teeth[26].M = 'caries';
    p.selTooth = 26;
    p.estoma.encia = {ok:false, obs:'Inflamación gingival marginal detectada en sesión'};
    S.legTab = 'odonto';
    goView('legajo');
    toast('¡Odontograma (Pieza 26) y Presupuesto actualizados por IA!', 'bolt');
    return;
  }

  /* Portal del Paciente y Firma Digital */
  if(act === 'sig-clear'){ R.portal(); return; }
  if(act === 'sig-save'){
    S.portalSigned = true;
    R.portal();
    toast('Firma de conformidad guardada · Ya figura lista en Obras Sociales', 'verified');
    return;
  }
  if(act === 'portal-pay'){
    S.portalPaid = true;
    p.presupuestoSt = 'Aprobado y señado online';
    R.portal();
    toast('Presupuesto aprobado y pago acreditado por Mercado Pago', 'paid');
    return;
  }

  if(act === 'wa-presu'){
    const targetP = patById(actEl.dataset.pid || S.pid);
    const pl = computePlan20(targetP);
    toast(`Presupuesto de ${money(pl.totalPaciente)} enviado por WhatsApp a ${targetP.n}`, 'send');
    return;
  }

  if(act === 'urgencia-modal'){
    openDrawer('Sobreturno de Urgencia Odontológica (15 min)', `
      <p class="muted">En odontología las urgencias diarias (dolor agudo, flemón, corona caída o bracket despegado) requieren un hueco corto sin desarmar la agenda.</p>
      <div><label class="eyebrow">Paciente</label><input class="inp" value="${p.n} (${p.tel})"></div>
      <div><label class="eyebrow">Motivo de la urgencia</label>
        <select class="inp">
          <option>Dolor agudo / Pulpitis (Requiere apertura)</option>
          <option>Se despegó un bracket / Arco pincha mucosa</option>
          <option>Se descementó provisorio o corona</option>
          <option>Inflamación / Flemón (Evaluar antibiótico)</option>
        </select>
      </div>
      <div><label class="eyebrow">Hueco sugerido hoy</label><input class="inp" value="Hoy 11:45 hs · Sillón 5 (Urgencias · Dra. Valentina Paz)" readonly></div>
    `, `<button class="btn" data-act="close-drawer">Cancelar</button><button class="btn acc" style="flex:1" onclick="closeDrawer();toast('Sobreturno de urgencia asignado en Sillón 5 · Aviso enviado por WhatsApp','emergency')">${ico('emergency')}Confirmar Sobreturno</button>`);
    return;
  }
});

document.addEventListener('input', e => {
  if(e.target.dataset.act === 'estoma-obs'){
    const p = patById(S.pid);
