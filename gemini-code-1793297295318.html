<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Proyecto Odontología · Plataforma Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block">
<style>
:root{
  --bg:#F6F9FB; --surface:#FFFFFF; --surface-2:#EDF3F7; --surface-3:#E1EBF2;
  --ink:#18242E; --muted:#4A5B68; --subtle:#6C7E8C; --line:#E2EAF0; --line-2:#CBD8E3;
  --primary:#0E7490; --primary-deep:#0B576C; --primary-ink:#FFFFFF; --primary-soft:#E0F2FE;
  --accent:#D95D39; --accent-deep:#A63A1B; --accent-soft:#FDECE6;
  --mustard:#C27D1A; --mustard-soft:#FEF5E6;
  --ok:#15803D; --ok-soft:#DCFCE7; --warn:#B45309; --warn-soft:#FEF3C7; --bad:#DC2626; --bad-soft:#FEE2E2;
  --f:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r1:6px; --r2:10px; --r3:14px; --r4:18px;
  --sh1:0 1px 3px rgba(15,35,50,.06), 0 2px 8px -2px rgba(15,35,50,.05);
  --sh2:0 10px 28px -8px rgba(15,35,50,.14);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.5;padding-left:245px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
h1{font-size:28px;line-height:1.15} h2{font-size:18px} h3{font-size:15.5px} h4{font-size:13px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .subtle{color:var(--subtle)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;user-select:none}
[hidden]{display:none!important}

/* Sidebar & Topbar */
.side{position:fixed;top:0;left:0;bottom:0;width:245px;z-index:35;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:var(--r2);background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.brand b{display:block;font-size:15px;line-height:1.1}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:16px}
.ngrp{display:flex;flex-direction:column;gap:3px}
.grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);padding:0 10px 4px}
.nav button{display:flex;gap:11px;align-items:center;width:100%;border:0;background:none;padding:9px 12px;border-radius:var(--r2);color:var(--muted);font-weight:600;font-size:14px;text-align:left;transition:.15s}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary-deep);font-weight:700}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.proto{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary-deep);background:var(--primary-soft);padding:4px 8px;border-radius:var(--r1);width:fit-content}

.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1340px;margin:0 auto;padding:0 24px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:1.5fr 1fr}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);padding:18px;box-shadow:var(--sh1)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chead p{color:var(--muted);font-size:12.5px;margin-top:2px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:22px 0}
.vhead p{color:var(--muted);margin-top:4px;max-width:65ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r2);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13px;transition:.15s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-deep)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--r1);font-size:11.5px;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neu{background:var(--surface-2);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent-deep)}

.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-size:14px}
.li .grow small{display:block;color:var(--muted);font-size:12.5px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--primary-soft);color:var(--primary-deep);flex:none}
.inp{width:100%;height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r2);padding:0 11px}

/* Legajo & Odontograma + Presupuesto 20 items */
.leg{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.plist{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow-y:auto}
.prow{display:flex;gap:10px;align-items:center;width:100%;padding:9px;border:0;border-radius:var(--r2);background:none;text-align:left}
.prow:hover{background:var(--surface-2)}
.prow[aria-current="true"]{background:var(--primary-soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 13px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--primary-deep);border-bottom-color:var(--primary);font-weight:700}

.od-split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.95fr);gap:16px;align-items:start}
.od-toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:var(--surface-2);border-radius:var(--r3);margin-bottom:12px}
.od-tool{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r2);border:1.5px solid var(--line-2);background:var(--surface);font-size:12px;font-weight:700;color:var(--muted)}
.od-tool i{width:10px;height:10px;border-radius:3px;display:inline-block}
.od-tool[aria-pressed="true"]{border-color:var(--primary-deep);background:var(--primary-soft);color:var(--primary-deep)}
.od-mouth{background:var(--bg);border:1px solid var(--line);border-radius:var(--r3);padding:14px 10px;overflow-x:auto}
.od-jaw{display:grid;grid-template-columns:1fr 2px 1fr;gap:10px;min-width:560px;align-items:center}
.od-midline{background:var(--line-2);align-self:stretch}
.od-quad{display:flex;gap:4px;justify-content:center}
.od-tooth{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 2px;border-radius:6px;cursor:pointer;user-select:none}
.od-tooth:hover{background:var(--surface-2)}
.od-tooth b{font-size:11px;font-weight:800;color:var(--muted)}
.od-svg{width:31px;height:31px;display:block}
.od-svg polygon,.od-svg rect{fill:#fff;stroke:#64748B;stroke-width:1.6;transition:fill .12s}
.od-svg polygon:hover,.od-svg rect:hover{filter:brightness(.9)}
.od-svg .f-caries{fill:#EF4444!important}
.od-svg .f-resina{fill:#3B82F6!important}
.od-svg .f-sellante{fill:#10B981!important}
.od-tag{font-size:9px;font-weight:800;height:14px;padding:0 4px;border-radius:3px;display:inline-flex;align-items:center}

.presu-box{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--surface)}
.presu-list{max-height:430px;overflow-y:auto}
.presu-row{display:grid;grid-template-columns:24px minmax(0,1fr) 74px 86px;gap:6px;align-items:center;padding:7px 11px;border-top:1px solid var(--line);font-size:12.5px}
.presu-row:first-child{border-top:0}
.presu-row.on{background:var(--primary-soft);font-weight:700}
.presu-qty{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end}
.presu-qty button{width:21px;height:21px;border-radius:4px;border:1px solid var(--line-2);background:#fff;font-weight:800;padding:0}

/* Estomatológico e IHOS */
.est-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.est-card{border:1.5px solid var(--line);border-radius:var(--r3);padding:10px 12px;background:var(--surface)}
.est-card.abn{border-color:var(--warn);background:var(--warn-soft)}
.ihos-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.ihos-cell{border:1px solid var(--line-2);border-radius:var(--r2);padding:8px;text-align:center;background:var(--surface)}
.ihos-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:6px}
.ihos-opts button{height:25px;border:1px solid var(--line-2);border-radius:4px;background:var(--bg);font-weight:800;font-size:12px}
.ihos-opts button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Agenda de Sillones */
.cal{display:grid;grid-template-columns:60px repeat(5,minmax(125px,1fr));min-width:720px;border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--surface)}
.cal .hd{background:var(--surface-2);padding:9px 8px;font-size:12px;font-weight:700;border-bottom:1px solid var(--line)}
.cal .hr{padding:10px 8px;font-size:11.5px;color:var(--subtle);font-weight:700;border-top:1px solid var(--line)}
.cal .sl{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;min-height:64px}
.tn{width:100%;border:0;border-radius:var(--r2);padding:6px 8px;text-align:left;background:var(--primary-soft);color:var(--primary-deep);display:flex;flex-direction:column;gap:2px;font-size:11.5px}
.tn b{font-size:12.5px;color:var(--ink)}

/* Phone preview */
.stage{display:grid;grid-template-columns:380px minmax(0,1fr);gap:32px;align-items:start}
.phone{background:#18242E;border-radius:40px;padding:10px;box-shadow:var(--sh2)}
.screen{background:var(--bg);border-radius:32px;height:720px;overflow-y:auto;padding:18px 15px;display:flex;flex-direction:column;gap:12px}
.sig{width:100%;height:140px;border:1.5px dashed var(--line-2);border-radius:var(--r2);background:#fff;touch-action:none;cursor:crosshair}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r3);display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:90}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pings{position:fixed;top:68px;right:20px;z-index:85;width:min(360px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px}
.ping{background:var(--surface);border:2px solid var(--mustard);border-radius:var(--r3);padding:14px;box-shadow:var(--sh2)}

@media (max-width:980px){
  body{padding-left:0;padding-bottom:74px}
  .side{top:auto;right:0;width:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line)}
  .side .brand,.side-foot,.grp{display:none}
  .nav{flex-direction:row;width:100%;overflow-x:auto;gap:2px}
  .ngrp{display:contents}
  .nav button{flex:1 0 70px;flex-direction:column;gap:2px;padding:6px 4px;font-size:11px;text-align:center;justify-content:center}
  .kpis,.g-2,.g-2e,.leg,.od-split,.stage,.est-grid{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>

<main class="wrap" id="app" style="padding-bottom:60px"></main>

let toastT;
function toast(msg, ic='check_circle'){
  const t = $('#toast');
  t.innerHTML = `${ico(ic)}<span>${msg}</span>`;
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('on'), 3200);
}

/* ===== CÁLCULO AUTOMÁTICO DEL PRESUPUESTO DE 20 ÍTEMS DESDE EL ODONTOGRAMA ===== */
function calcPresupuesto(p){
  const counts = {};
  ITEMS_20.forEach(it => counts[it.id] = p.extraQty[it.id] || 0);
  Object.entries(p.teeth).forEach(([num, data]) => {
    const n = +num, isChild = n >= 51;
    const isAnt = [13,12,11,21,22,23,43,42,41,31,32,33,53,52,51,61,62,63,83,82,81,71,72,73].includes(n);
    const cariesFaces = Object.values(data.faces||{}).filter(v=>v==='caries').length;
    const sellFaces = Object.values(data.faces||{}).filter(v=>v==='sellante').length;
    if(cariesFaces === 1) counts[6] = (counts[6]||0) + 1;
    else if(cariesFaces === 2) counts[7] = (counts[7]||0) + 1;
    else if(cariesFaces >= 3) counts[8] = (counts[8]||0) + 1;
    if(sellFaces > 0) counts[18] = (counts[18]||0) + 1;
    if(data.whole === 'extraccion') counts[5] = (counts[5]||0) + 1;
    if(data.whole === 'corona') counts[14] = (counts[14]||0) + 1;
    if(data.whole === 'perno') counts[13] = (counts[13]||0) + 1;
    if(data.whole === 'endo'){
      if(isChild) counts[12] = (counts[12]||0) + 1;
      else if(isAnt) counts[9] = (counts[9]||0) + 1;
      else counts[10] = (counts[10]||0) + 1;
    }
    if(data.whole === 'pulpo') counts[11] = (counts[11]||0) + 1;
  });
  let bruto = 0, cubierto = 0;
  const rows = ITEMS_20.map(it => {
    const q = counts[it.id] || 0;
    const sub = q * it.p;
    const cob = sub * (p.cobPct * it.os);
    bruto += sub; cubierto += cob;
    return {...it, q, sub, bolsillo: Math.max(0, sub - cob)};
  });
  return {rows, bruto, cubierto, bolsillo: Math.max(0, bruto - cubierto)};
}

/* ===== VISTA PRINCIPAL: LEGAJO + PLANILLA 1 (ODONTOGRAMA/PRESUPUESTO) + PLANILLA 2 (ESTOMATOLÓGICO/IHOS) ===== */
function toothSVG(num, data){
  const f = (data && data.faces) || {}, w = data && data.whole;
  const fc = side => f[side] ? `f-${f[side]}` : '';
  return `<div class="od-tooth" data-tooth="${num}">
    <b class="num">${num}</b>
    <svg class="od-svg" viewBox="0 0 40 40">
      <polygon points="2,2 38,2 28,12 12,12" class="${fc('V')}" data-face="V"><title>Pieza ${num} · Cara Vestibular/Superior</title></polygon>
      <polygon points="2,38 38,38 28,28 12,28" class="${fc('P')}" data-face="P"><title>Pieza ${num} · Cara Palatina/Lingual</title></polygon>
      <polygon points="2,2 12,12 12,28 2,38" class="${fc('M')}" data-face="M"><title>Pieza ${num} · Cara Mesial/Izquierda</title></polygon>
      <polygon points="38,2 28,12 28,28 38,38" class="${fc('D')}" data-face="D"><title>Pieza ${num} · Cara Distal/Derecha</title></polygon>
      <rect x="12" y="12" width="16" height="16" class="${fc('O')}" data-face="O"><title>Pieza ${num} · Cara Oclusal/Central</title></rect>
      ${w==='extraccion'?`<line x1="3" y1="3" x2="37" y2="37" stroke="#DC2626" stroke-width="4"/><line x1="37" y1="3" x2="3" y2="37" stroke="#DC2626" stroke-width="4"/>`:''}
      ${w==='corona'?`<circle cx="20" cy="20" r="16" fill="none" stroke="#D97706" stroke-width="3.2"/>`:''}
      ${w==='endo'||w==='pulpo'?`<line x1="20" y1="3" x2="20" y2="37" stroke="#7C3AED" stroke-width="3.5"/>`:''}
      ${w==='perno'?`<rect x="17" y="4" width="6" height="32" fill="#0E7490"/>`:''}
    </svg>
    ${w?`<span class="od-tag" style="background:var(--surface-2);color:var(--ink)">${w.toUpperCase()}</span>`:'<span style="height:14px"></span>'}
  </div>`;
}

function initCanvasSig(){
  const c = $('#sig'); if(!c) return;
  const r = c.getBoundingClientRect(); c.width = r.width; c.height = r.height;
  const x = c.getContext('2d'); x.lineWidth = 2.5; x.lineCap = 'round'; x.strokeStyle = '#0E7490';
  let down = false;
  c.onpointerdown = e => { down = true; x.beginPath(); x.moveTo(e.offsetX, e.offsetY) };
  c.onpointermove = e => { if(down){ x.lineTo(e.offsetX, e.offsetY); x.stroke() } };
  c.onpointerup = () => { down = false };
}

function go(v){
  S.view = v;
  $$('#nav [data-v]').forEach(b => b.setAttribute('aria-current', b.dataset.v===v ? 'page' : 'false'));
  R[v]();
}

/* ===== INTERACCIONES EN VIVO ===== */
document.addEventListener('click', e => {
  const nav = e.target.closest('#nav [data-v]');
  if(nav){ go(nav.dataset.v); return }
  const goBtn = e.target.closest('[data-go]');
  if(goBtn){ go(goBtn.dataset.go); return }

  /* Click en una cara o diente del Odontograma */
  const face = e.target.closest('[data-face]');
  if(face){
    const toothEl = face.closest('[data-tooth]'), num = toothEl.dataset.tooth, fKey = face.dataset.face;
    const p = patById(S.pid);
    p.teeth[num] = p.teeth[num] || {faces:{}, whole:null};
    if(['caries','resina','sellante'].includes(S.tool)){
      p.teeth[num].faces[fKey] = p.teeth[num].faces[fKey]===S.tool ? null : S.tool;
    } else if(S.tool==='borrar'){
      p.teeth[num] = {faces:{}, whole:null};
    } else {
      p.teeth[num].whole = p.teeth[num].whole===S.tool ? null : S.tool;
    }
    R.legajo();
    toast(`Pieza ${num} actualizada · Presupuesto recalculado en vivo`, 'calculate');
    return;
  }

  const act = e.target.closest('[data-act]');
  if(!act) return;
  const k = act.dataset.act, p = patById(S.pid);

  if(k==='pick-pat' || k==='open-pat'){ S.pid = act.dataset.pid; go('legajo'); }
  if(k==='tab'){ S.tab = act.dataset.t; R.legajo(); }
  if(k==='tool'){ S.tool = act.dataset.t; R.legajo(); }
  if(k==='dent'){ p.dent = act.dataset.d; R.legajo(); }
  if(k==='pqty'){
    const id = +act.dataset.id, d = +act.dataset.d;
    p.extraQty[id] = Math.max(0, (p.extraQty[id]||0) + d);
    R.legajo();
  }
  if(k==='est-toggle'){
    const sk = act.dataset.k, st = p.est[sk];
    st.ok = !st.ok;
    if(!st.ok && !st.obs) st.obs = EST_STRUCTS.find(x=>x.k===sk).sug;
    R.legajo();
  }
  if(k==='ihos'){
    p[act.dataset.t][+act.dataset.i] = +act.dataset.v;
    R.legajo();
  }
  if(k==='add-destartraje'){
    p.extraQty[2] = (p.extraQty[2]||0) + 1;
    S.tab = 'odonto'; R.legajo();
    toast('Ítem 2 (Destartraje + Profilaxis) sumado al presupuesto', 'add_task');
  }
  if(k==='send-presu'){ toast('Presupuesto enviado por WhatsApp al Portal del Paciente', 'send'); }
  if(k==='orden-dentalscan'){ toast('Orden digital para Dental Scan (La Rioja 3501) enviada por WhatsApp al paciente', 'radiology'); }
  if(k==='llego'){
    const t = TURNOS.find(x=>x.id===act.dataset.tid), pat = patById(t.pid), sil = SILLONES.find(x=>x.id===t.sillon);
    t.sala = true; R.sillones();
    $('#pings').innerHTML = `<div class="ping"><b>${ico('chair')} ${pat.n} llegó a Recepción</b><p class="muted" style="font-size:13px;margin:4px 0 8px">${sil.n} · ${t.prac}</p><button class="btn sm pri" onclick="this.closest('.ping').remove()">Ya lo hago pasar</button></div>`;
    toast(`Aviso en vivo enviado a ${sil.pro}`, 'notifications_active');
  }
  if(k==='voice-demo'){ S.voiceDone = true; R.manoslibres(); }
  if(k==='voice-apply'){
    p.teeth['17'] = {faces:{M:'caries',O:'caries'}, whole:null};
    p.extraQty[2] = (p.extraQty[2]||0) + 1;
    S.tab = 'odonto'; go('legajo');
    toast('IA impactó Pieza 17 (Resina compuesta) + Destartraje en el Odontograma', 'auto_awesome');
  }
  if(k==='foto-planilla'){
    p.extraQty[18] = (p.extraQty[18]||0) + 2;
    S.tab = 'odonto'; go('legajo');
    toast('Planilla leída: se sumaron 2 Sellantes (Ítem 18) al presupuesto', 'document_scanner');
  }
  if(k==='firmar-ok'){ p.signed = true; go('obras'); toast('Firma digital registrada en el legajo de ' + p.n, 'verified'); }
  if(k==='approve-presu'){ p.presuApproved = true; R.portal(); toast('Presupuesto aprobado por el paciente', 'check_circle'); }
  if(k==='urgencia'){ toast('Solicitud de sobreturno de urgencia enviada a Recepción', 'emergency'); }
});
