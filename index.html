<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Proyecto Odontología · Plataforma Clínica Integral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block">
<style>
:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#EDF2F7; --surface-3:#E2E8F0;
  --ink:#0F172A; --muted:#475569; --subtle:#64748B; --line:#E2E8F0; --line-2:#CBD5E1;
  --primary:#0284C7; --primary-deep:#0369A1; --primary-ink:#FFFFFF; --primary-soft:#E0F2FE;
  --accent:#EA580C; --accent-deep:#C2410C; --accent-soft:#FFEDD5;
  --mustard:#D97706; --mustard-soft:#FEF3C7;
  --ok:#16A34A; --ok-soft:#DCFCE7; --warn:#D97706; --warn-soft:#FEF3C7; --bad:#DC2626; --bad-soft:#FEE2E2;
  --wa:#25D366; --wa-deep:#128C7E; --wa-bg:#ECE5DD;
  --f:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r1:6px; --r2:10px; --r3:14px; --r4:18px;
  --sh1:0 1px 3px rgba(15,23,42,.06), 0 2px 8px -2px rgba(15,23,42,.05);
  --sh2:0 12px 32px -8px rgba(15,23,42,.14);
  --sh3:0 24px 60px -16px rgba(15,23,42,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;padding-left:250px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
h1{font-size:25px;line-height:1.15} h2{font-size:17.5px} h3{font-size:15px} h4{font-size:12.5px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .subtle{color:var(--subtle)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;user-select:none}
[hidden]{display:none!important}

/* Sidebar estilo SaaS Moderno */
.side{position:fixed;top:0;left:0;bottom:0;width:250px;z-index:35;background:#0F172A;color:#F8FAFC;display:flex;flex-direction:column;gap:14px;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.logo{width:38px;height:38px;border-radius:var(--r2);background:linear-gradient(135deg,#0284C7,#38BDF8);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 4px 12px rgba(2,132,199,.4)}
.brand b{display:block;font-size:15px;line-height:1.1;color:#fff}
.brand span{font-size:11.5px;color:#94A3B8}
.role-box{padding:10px 12px;border-radius:var(--r3);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:3px}
.role-box small{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#38BDF8}
.role-box b{font-size:13px;color:#fff}
.role-box span{color:#94A3B8;font-size:11px}
.nav{display:flex;flex-direction:column;gap:12px}
.ngrp{display:flex;flex-direction:column;gap:2px}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#64748B;padding:0 10px 4px}
.nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8.5px 12px;border-radius:var(--r2);color:#CBD5E1;font-weight:600;font-size:13.5px;text-align:left;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="page"]{background:var(--primary);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(2,132,199,.35)}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px}
.proto{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#38BDF8;background:rgba(56,189,248,.14);padding:4px 8px;border-radius:var(--r1);width:fit-content}

/* Topbar */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:1.45fr 1fr}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);padding:18px;box-shadow:var(--sh1)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chead p{color:var(--muted);font-size:12.5px;margin-top:2px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:18px 0}
.vhead p{color:var(--muted);margin-top:4px;max-width:68ch}

/* Selector de Perfiles */
.prof-sw{display:inline-flex;padding:3px;gap:3px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r3)}
.prof-sw button{border:0;background:none;height:32px;padding:0 11px;border-radius:var(--r2);font-weight:700;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;transition:.15s}
.prof-sw button .ms{font-size:17px}
.prof-sw button[aria-pressed="true"]{background:var(--primary);color:#fff;box-shadow:var(--sh1)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r2);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-deep)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{background:var(--wa-deep)}
.btn.ghost{border-color:transparent;background:none;color:var(--primary-deep)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--r1);font-size:11.5px;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neu{background:var(--surface-2);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent-deep)}

.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-size:14px}
.li .grow small{display:block;color:var(--muted);font-size:12.5px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--primary-soft);color:var(--primary-deep);flex:none}
.av.acc{background:var(--accent-soft);color:var(--accent-deep)}
.inp{width:100%;height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r2);padding:0 11px}
textarea.inp{height:auto;min-height:92px;padding:10px 11px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);text-align:left;padding:11px 12px;background:var(--surface-2)}
td{padding:12px;border-top:1px solid var(--line);font-size:13px}

/* Barra interactiva del Simulador Manual */
.simbar{background:linear-gradient(90deg, var(--primary-soft), #F0F9FF);border:1.5px solid var(--primary);border-radius:var(--r3);padding:10px 14px;margin-top:14px;display:flex;flex-direction:column;gap:8px}
.sim-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.sim-st{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:var(--r2);background:var(--surface);border:1px solid var(--line-2);font-size:11.5px;font-weight:700;color:var(--muted);text-align:left;transition:.15s}
.sim-st:hover{border-color:var(--primary);color:var(--ink)}
.sim-st.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sim-st.curr{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--sh1)}
.sim-st .num{width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:10.5px;flex:none}
.sim-st.curr .num{background:rgba(255,255,255,.25)}

/* Legajo & Odontograma Elástico (Cero Scroll Horizontal) */
.leg{display:grid;grid-template-columns:235px minmax(0,1fr);gap:14px;align-items:start}
.plist{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow-y:auto}
.prow{display:flex;gap:10px;align-items:center;width:100%;padding:8px;border:0;border-radius:var(--r2);background:none;text-align:left}
.prow:hover{background:var(--surface-2)}
.prow[aria-current="true"]{background:var(--primary-soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;gap:5px;align-items:center;font-size:13px}
.tabs button[aria-selected="true"]{color:var(--primary-deep);border-bottom-color:var(--primary);font-weight:700}

.od-split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.9fr);gap:14px;align-items:start}
.od-toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:8px;background:var(--surface-2);border-radius:var(--r3);margin-bottom:10px}
.od-tool{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border-radius:var(--r2);border:1.5px solid var(--line-2);background:var(--surface);font-size:11.5px;font-weight:700;color:var(--muted);transition:.12s}
.od-tool i{width:10px;height:10px;border-radius:3px;display:inline-block}
.od-tool[aria-pressed="true"]{border-color:var(--primary-deep);background:var(--primary-soft);color:var(--primary-deep);box-shadow:var(--sh1)}

.od-mouth{background:var(--bg);border:1px solid var(--line);border-radius:var(--r3);padding:14px 10px;overflow:hidden}
.od-jaw{display:grid;grid-template-columns:minmax(0,1fr) 2px minmax(0,1fr);gap:8px;width:100%;align-items:start}
.od-midline{background:var(--line-2);align-self:stretch}
.od-quad{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:2px;width:100%;align-items:start}
.od-tooth{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 1px;border-radius:6px;cursor:pointer;user-select:none;min-width:0;transition:background .15s,transform .12s}
.od-tooth:hover{background:var(--surface-2);transform:translateY(-1px)}
.od-tooth b{font-size:10.5px;font-weight:800;color:var(--muted);line-height:1}
.od-svg{width:100%;max-width:34px;aspect-ratio:1/1;height:auto;display:block}
.od-svg polygon,.od-svg rect{fill:#fff;stroke:#64748B;stroke-width:1.6;transition:fill .12s}
.od-svg polygon:hover,.od-svg rect:hover{filter:brightness(.9)}
.od-svg .f-caries{fill:#EF4444!important}
.od-svg .f-resina{fill:#3B82F6!important}
.od-svg .f-sellante{fill:#10B981!important}
.od-tag{font-size:8px;font-weight:800;height:13px;padding:0 3px;border-radius:3px;display:inline-flex;align-items:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.presu-box{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--surface)}
.presu-list{max-height:430px;overflow-y:auto}
.presu-row{display:grid;grid-template-columns:24px minmax(0,1fr) 72px 84px;gap:6px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-size:12.5px}
.presu-row:first-child{border-top:0}
.presu-row.on{background:var(--primary-soft);font-weight:700}
.presu-qty{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end}
.presu-qty button{width:21px;height:21px;border-radius:4px;border:1px solid var(--line-2);background:#fff;font-weight:800;padding:0}

/* Estomatológico, IHOS y Pasaporte de Implantes */
.est-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.est-card{border:1.5px solid var(--line);border-radius:var(--r3);padding:10px 12px;background:var(--surface)}
.est-card.abn{border-color:var(--warn);background:var(--warn-soft)}
.ihos-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.ihos-cell{border:1px solid var(--line-2);border-radius:var(--r2);padding:8px;text-align:center;background:var(--surface)}
.ihos-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:6px}
.ihos-opts button{height:25px;border:1px solid var(--line-2);border-radius:4px;background:var(--bg);font-weight:800;font-size:12px}
.ihos-opts button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.pano-card{background:#11161B;color:#E8F1F5;border-radius:var(--r3);padding:16px;border:1px solid #26323D}
.imp-pass{background:linear-gradient(135deg,#0F172A,#1E293B);color:#F8FAFC;border-radius:var(--r3);padding:14px;border:1px solid #334155}

/* NUEVO: Hoja Membretada de Receta Rp/ (Inspirado en DentalSoft) */
.paper-preview{background:#F1F5F9;border:1px solid var(--line-2);border-radius:var(--r3);padding:18px}
.rx-sheet{background:#FFFFFF;border:1px solid #CBD5E1;border-radius:6px;padding:28px 30px;box-shadow:0 8px 24px rgba(15,23,42,.08);color:#0F172A;font-size:13px;position:relative}
.rx-sheet-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5px solid #E2E8F0;padding-bottom:16px;margin-bottom:16px}
.rx-rp{font-family:Georgia,serif;font-style:italic;font-size:24px;font-weight:700;color:#0F172A;margin:16px 0 8px}
.rx-sig-line{margin-top:42px;display:flex;justify-content:flex-end}
.rx-sig-box{text-align:center;width:200px;border-top:1px solid #94A3B8;padding-top:4px}
.rx-sig-hand{font-family:"Caveat",cursive;font-size:28px;color:#1E3A8A;line-height:1;margin-bottom:-6px}

/* NUEVO: Planilla Oficial de Obra Social ("Registro de Prestaciones" estilo DentalSoft) */
.os-form-sheet{background:#FFFFFF;border:1.5px solid #1E293B;padding:20px;color:#0F172A;font-size:11.5px;box-shadow:var(--sh1)}
.os-form-hdr{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;border-bottom:2px solid #1E293B;padding-bottom:10px;margin-bottom:10px;align-items:center}
.os-form-line{border-bottom:1px dotted #64748B;display:inline-block;min-width:110px;padding:0 4px;font-weight:700}
.os-form-table th,.os-form-table td{border:1px solid #1E293B;padding:5px 6px;font-size:11px}
.os-form-table th{background:#F1F5F9;color:#0F172A;text-align:center}
.os-kpi-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.os-kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--primary));border-radius:var(--r3);padding:14px 16px;box-shadow:var(--sh1)}
.os-kpi b{font-size:26px;display:block;line-height:1.1}
.os-chk-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r2);border:1.5px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer}
.os-chk-pill.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-deep)}

/* NUEVO: Editor de Plantillas WhatsApp + Chat (Estilo DentalSoft) */
.var-pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);font-family:monospace;font-size:12px;font-weight:700;color:var(--primary-deep);cursor:pointer;transition:.12s}
.var-pill:hover{background:var(--primary-soft);border-color:var(--primary)}
.wa-preview-box{background:var(--wa-bg);border-radius:var(--r3);padding:20px;border:1px solid #D1C7B7}
.wa-bubble{background:#FFFFFF;border-radius:0 12px 12px 12px;padding:14px 16px;max-width:420px;box-shadow:0 2px 5px rgba(0,0,0,.08);font-size:13.5px;line-height:1.5;white-space:pre-line;color:#111B21;position:relative}
.wa-bubble.out{background:#D9FDD3;border-radius:12px 0 12px 12px;margin-left:auto}
.chat-layout{display:grid;grid-template-columns:280px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;background:var(--surface);min-height:520px}
.chat-side{border-right:1px solid var(--line);background:var(--surface)}
.chat-main{display:flex;flex-direction:column;background:var(--wa-bg)}
.chat-msgs{flex:1;padding:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.chat-24h{background:#FEF3C7;border-bottom:1px solid #FDE68A;color:#92400E;padding:9px 16px;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}

/* NUEVO: Modal Guía Rápida de 6 Tarjetas ("¡Bienvenido!") */
.guide-ov{position:fixed;inset:0;z-index:95;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;overflow-y:auto}
.guide-modal{background:var(--surface);border-radius:22px;max-width:980px;width:100%;padding:32px;box-shadow:var(--sh3);position:relative;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.guide-card{border:1.5px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:.18s;background:var(--surface);text-align:left}
.guide-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--sh2)}
.guide-num{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;background:var(--primary-soft);color:var(--primary-deep)}

/* Agenda de Sillones */
.cal{display:grid;grid-template-columns:60px repeat(auto-fit,minmax(130px,1fr));min-width:720px;border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--surface)}
.cal .hd{background:var(--surface-2);padding:9px 8px;font-size:12px;font-weight:700;border-bottom:1px solid var(--line)}
.cal .hr{padding:10px 8px;font-size:11.5px;color:var(--subtle);font-weight:700;border-top:1px solid var(--line)}
.cal .sl{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;min-height:68px}
.tn{width:100%;height:100%;border:0;border-radius:var(--r2);padding:6px 8px;text-align:left;background:var(--primary-soft);color:var(--primary-deep);display:flex;flex-direction:column;gap:2px;font-size:11.5px;transition:transform .15s,box-shadow .15s}
.tn:hover{transform:translateY(-2px);box-shadow:var(--sh1)}
.tn.new{outline:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
.tn b{font-size:12.5px;color:var(--ink)}
.free-btn{width:100%;height:100%;min-height:58px;border:1.5px dashed var(--line-2);border-radius:var(--r2);background:none;color:var(--subtle);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;transition:.15s}
.free-btn:hover{border-color:var(--primary);color:var(--primary-deep);background:var(--primary-soft)}

/* Drawer Lateral */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);box-shadow:var(--sh3);z-index:61;transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .db{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px}
.drawer label.eyebrow{display:block;margin-bottom:5px}

/* Phone preview */
.stage{display:grid;grid-template-columns:395px minmax(0,1fr);gap:32px;align-items:start}
.phone{background:#0F172A;border-radius:40px;padding:10px;box-shadow:var(--sh2)}
.screen{background:var(--bg);border-radius:32px;height:760px;overflow-y:auto;padding:18px 15px;display:flex;flex-direction:column;gap:12px}
.sig{width:100%;height:130px;border:1.5px dashed var(--line-2);border-radius:var(--r2);background:#fff;touch-action:none;cursor:crosshair}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r3);display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:98}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pings{position:fixed;top:68px;right:20px;z-index:85;width:min(380px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px}
.ping{background:var(--surface);border:2px solid var(--mustard);border-radius:var(--r3);padding:14px;box-shadow:var(--sh2)}

@media (max-width:1180px){
  .od-split{grid-template-columns:minmax(0,1fr)}
  .sim-steps,.guide-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){
  body{padding-left:0;padding-bottom:74px}
  .side{top:auto;right:0;width:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid rgba(255,255,255,.15)}
  .side .brand,.side-foot,.grp,.role-box{display:none}
  .nav{flex-direction:row;width:100%;overflow-x:auto;gap:2px}
  .ngrp{display:contents}
  .nav button{flex:1 0 72px;flex-direction:column;gap:2px;padding:6px 4px;font-size:10.5px;text-align:center;justify-content:center}
  .kpis,.os-kpi-cards,.g-2,.g-2e,.leg,.stage,.est-grid,.chat-layout{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:680px){
  .od-jaw{grid-template-columns:minmax(0,1fr);gap:10px}
  .od-midline{height:1px;width:100%}
  .od-svg{max-width:38px}
  .od-tooth b{font-size:11.5px}
  .frow,.sim-steps,.guide-grid{grid-template-columns:minmax(0,1fr)}
}

/* ===== CÁLCULO AUTOMÁTICO DEL PRESUPUESTO DE 20 ÍTEMS ===== */
function calcPresupuesto(p){
  const counts = {};
  ITEMS_20.forEach(it => counts[it.id] = p.extraQty[it.id] || 0);
  Object.entries(p.teeth).forEach(([num, data]) => {
    const n = +num, isChild = n >= 51;
    const isAnt = [13,12,11,21,22,23,43,42,41,31,32,33,53,52,51,61,62,63,83,82,81,71,72,73].includes(n);
    const cariesFaces = Object.values(data.faces||{}).filter(v=>v==='caries').length;
    const sellFaces = Object.values(data.faces||{}).filter(v=>v==='sellante').length;
    if(cariesFaces === 1) counts[6] = (counts[6]||0) + 1;
    else if(cariesFaces === 2) counts[7] = (counts[7]||0) + 1;
    else if(cariesFaces >= 3) counts[8] = (counts[8]||0) + 1;
    if(sellFaces > 0) counts[18] = (counts[18]||0) + 1;
    if(data.whole === 'extraccion') counts[5] = (counts[5]||0) + 1;
    if(data.whole === 'corona') counts[14] = (counts[14]||0) + 1;
    if(data.whole === 'perno') counts[13] = (counts[13]||0) + 1;
    if(data.whole === 'endo'){
      if(isChild) counts[12] = (counts[12]||0) + 1;
      else if(isAnt) counts[9] = (counts[9]||0) + 1;
      else counts[10] = (counts[10]||0) + 1;
    }
    if(data.whole === 'pulpo') counts[11] = (counts[11]||0) + 1;
  });
  let bruto = 0, cubierto = 0, costoLab = 0;
  const rows = ITEMS_20.map(it => {
    const q = counts[it.id] || 0;
    const sub = q * it.p;
    const cob = sub * (p.cobPct * it.os);
    bruto += sub; cubierto += cob; costoLab += q * (it.labCost||0);
    return {...it, q, sub, bolsillo: Math.max(0, sub - cob)};
  });
  return {rows, bruto, cubierto, costoLab, bolsillo: Math.max(0, bruto - cubierto)};
}

/* --- NUEVA VISTA: COBERTURAS POR OBRA SOCIAL Y PLAN (% DEL PRECIO O IMPORTE FIJO EN $) --- */

  const item = ITEMS_20.find(x=>x.id===+S.covPracId) || ITEMS_20[6];

      <div>

        <h1>Cobertura por Obra Social y Plan (% o Importe Fijo $)</h1>
        <p>Para cada plan elegí cómo reconoce la práctica la obra social: <b>como porcentaje del precio de lista</b> o <b>como importe fijo en pesos</b>. El sistema calcula en tiempo real cuánto abona la Obra Social y cuánto paga el paciente.</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;background:var(--surface-2)">
      <div class="row" style="justify-content:space-between">
        <div>
          <label class="eyebrow" for="cov-prac-sel">Simular Cobertura sobre la Práctica del Nomenclador:</label>
          <select id="cov-prac-sel" class="inp" style="width:auto;min-width:340px;font-weight:700;margin-top:4px">
            ${ITEMS_20.map(it=>`<option value="${it.id}" ${it.id===item.id?'selected':''}>Cód. ${it.cod} · ${it.n} — Precio de lista: ${money(it.p)}</option>`).join('')}
          </select>
        </div>
        <div style="text-align:right">
          <span class="eyebrow">Precio de Lista Particular</span>
          <h2 class="num" style="font-size:26px;color:var(--primary-deep)">${money(item.p)}</h2>
        </div>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead>
          <tr>
            <th>Obra Social / Prepaga</th>
            <th>Plan</th>
            <th>Modalidad de Cobertura</th>
            <th>Valor Reconocido</th>
            <th style="text-align:right">Cubre Obra Social</th>
            <th style="text-align:right">Paciente Paga (Copago)</th>
          </tr>
        </thead>
        <tbody>
          ${COBERTURAS.map((c,idx)=>{
            const cubreOS = c.modo==='pct' ? Math.round(item.p * (c.val/100)) : Math.min(item.p, c.val);

                </select>
              </td>
              <td>
                <input type="number" class="inp num" style="height:32px;width:120px;font-weight:700" data-cov-val="${idx}" value="${c.val}">
              </td>
              <td class="num" style="text-align:right;color:var(--ok);font-weight:700">${money(cubreOS)}</td>
              <td class="num" style="text-align:right;font-weight:800;font-size:14px">
                ${money(pacPaga)} <small class="muted" style="font-weight:500">(${pctPac}%)</small>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
};

/* ===== FICHA DEL PACIENTE ===== */
function toothSVG(num, data){
  const f = (data && data.faces) || {}, w = data && data.whole, by = data && data.by;
  const fc = side => f[side] ? `f-${f[side]}` : '';
  return `<div class="od-tooth" data-tooth="${num}" title="${by ? 'Registrado por: '+by : 'Pieza '+num}">
    <b class="num">${num}</b>
    <svg class="od-svg" viewBox="0 0 40 40">
      <polygon points="2,2 38,2 28,12 12,12" class="${fc('V')}" data-face="V"></polygon>
      <polygon points="2,38 38,38 28,28 12,28" class="${fc('P')}" data-face="P"></polygon>
      <polygon points="2,2 12,12 12,28 2,38" class="${fc('M')}" data-face="M"></polygon>
      <polygon points="38,2 28,12 28,28 38,38" class="${fc('D')}" data-face="D"></polygon>
      <rect x="12" y="12" width="16" height="16" class="${fc('O')}" data-face="O"></rect>
      ${w==='extraccion'?`<line x1="3" y1="3" x2="37" y2="37" stroke="#DC2626" stroke-width="4"/><line x1="37" y1="3" x2="3" y2="37" stroke="#DC2626" stroke-width="4"/>`:''}
      ${w==='corona'?`<circle cx="20" cy="20" r="16" fill="none" stroke="#D97706" stroke-width="3.2"/>`:''}
      ${w==='endo'||w==='pulpo'?`<line x1="20" y1="3" x2="20" y2="37" stroke="#7C3AED" stroke-width="3.5"/>`:''}
      ${w==='perno'?`<rect x="17" y="4" width="6" height="32" fill="#0E7490"/>`:''}
    </svg>
    ${w?`<span class="od-tag" style="background:var(--surface-2);color:var(--ink)">${w.toUpperCase()}</span>`:'<span style="height:13px"></span>'}
  </div>`;
}

  const avgPDB = (p.pdb.reduce((a,b)=>a+b,0)/6).toFixed(2);
  const avgPDD = (p.pdd.reduce((a,b)=>a+b,0)/6).toFixed(2);
  const ihos = (+avgPDB + +avgPDD).toFixed(2);
  const sem = ihos <= 1.2 ? ['ok','Higiene Adecuada (0.0 a 1.2)'] : ihos <= 3.0 ? ['warn','Higiene Regular · Indicar Destartraje (1.3 a 3.0)'] : ['bad','Higiene Deficiente · Indicar Periodoncia (3.1 a 6.0)'];

  return `
    <div class="grid g-2">
      <div>
        <div class="chead">
          <div><h3>Examen Estomatológico (Por Excepción)</h3><p>Todo figura Normal (SÍ) por defecto. Tocá una estructura solo si presenta hallazgo clínico (NO).</p></div>
        </div>
        <div class="est-grid">
          ${EST_STRUCTS.map(s=>{
            const st = p.est[s.k];
            return `<div class="est-card ${st.ok?'':'abn'}">
              <div class="row" style="justify-content:space-between">
                <b>${s.n}</b>
                <button class="btn sm ${st.ok?'done':'acc'}" data-act="est-toggle" data-k="${s.k}">${st.ok?'Normal · SÍ':'Con Hallazgo · NO'}</button>
              </div>
              ${st.ok ? '' : `<input class="inp" style="margin-top:8px;height:32px;font-size:12.5px" data-est-inp="${s.k}" value="${esc(st.obs)}" placeholder="${s.sug}">`}
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="card" style="background:var(--surface-2)">
        <div class="chead">
          <div><h3>Índice de Higiene Oral Simplificado (IHOS)</h3><p>Tocá de 0 a 3 en los 6 dientes testigo para calcular PDB + PDD automáticamente</p></div>
          <span class="chip ${sem[0]} num">IHOS Total: ${ihos}</span>
        </div>
        <div class="eyebrow">1. Placa Dental Blanda (PDB) · Promedio: <span class="num">${avgPDB}</span></div>
        <div class="ihos-grid">
          ${IHOS_TEETH.map((t,i)=>`<div class="ihos-cell"><small style="font-weight:700">${t}</small><div class="ihos-opts">${[0,1,2,3].map(v=>`<button data-act="ihos" data-t="pdb" data-i="${i}" data-v="${v}" aria-pressed="${p.pdb[i]===v}">${v}</button>`).join('')}</div></div>`).join('')}
        </div>
        <div class="eyebrow" style="margin-top:14px">2. Placa Dental Dura / Cálculo (PDD) · Promedio: <span class="num">${avgPDD}</span></div>
        <div class="ihos-grid">
          ${IHOS_TEETH.map((t,i)=>`<div class="ihos-cell"><small style="font-weight:700">${t}</small><div class="ihos-opts">${[0,1,2,3].map(v=>`<button data-act="ihos" data-t="pdd" data-i="${i}" data-v="${v}" aria-pressed="${p.pdd[i]===v}">${v}</button>`).join('')}</div></div>`).join('')}
        </div>
        <div style="margin-top:14px;padding:10px 12px;border-radius:var(--r2);background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <div><b style="font-size:13px">${sem[1]}</b><small class="muted" style="display:block">Impacta directo en el presupuesto del paciente</small></div>
          ${ihos > 1.2 ? `<button class="btn sm pri" data-act="add-destartraje">+ Sumar Destartraje (Ítem 2) al Presupuesto</button>` : ''}
        </div>
      </div>
    </div>`;
}

function initCanvasSig(){
  const c = $('#sig'); if(!c) return;
  const r = c.getBoundingClientRect(); c.width = r.width; c.height = r.height;
  const x = c.getContext('2d'); x.lineWidth = 2.5; x.lineCap = 'round'; x.strokeStyle = '#0284C7';
  let down = false;
  c.onpointerdown = e => { down = true; x.beginPath(); x.moveTo(e.offsetX, e.offsetY) };
  c.onpointermove = e => { if(down){ x.lineTo(e.offsetX, e.offsetY); x.stroke() } };
  c.onpointerup = () => { down = false };
}

/* ===== EVENTOS GLOBALES ===== */
document.addEventListener('click', e => {
  const nav = e.target.closest('#nav [data-v]');
  if(nav){ go(nav.dataset.v); return }
  const goBtn = e.target.closest('[data-go]');
  if(goBtn && !goBtn.dataset.act){ go(goBtn.dataset.go); return }

  const face = e.target.closest('[data-face]');
  if(face){
    if(currentRole()==='sec'){ toast('Secretaría no edita el Odontograma', 'lock'); return; }
    const toothEl = face.closest('[data-tooth]'), num = toothEl.dataset.tooth, fKey = face.dataset.face;
    const p = patById(S.pid), u = currentUser();
    p.teeth[num] = p.teeth[num] || {faces:{}, whole:null};
    if(['caries','resina','sellante'].includes(S.tool)){
      p.teeth[num].faces[fKey] = p.teeth[num].faces[fKey]===S.tool ? null : S.tool;
    } else if(S.tool==='borrar'){
      p.teeth[num] = {faces:{}, whole:null};
    } else {
      p.teeth[num].whole = p.teeth[num].whole===S.tool ? null : S.tool;
    }
    p.teeth[num].by = `${u.n} · ${u.esp.split(' ')[0]}`;
    p.atendido = true;
    saveDB();
    renderSimBanner();
    R.legajo();
    toast(`Pieza ${num} registrada en Odontograma y en Planilla de Obra Social`, 'verified');
    return;
  }

  const act = e.target.closest('[data-act]');
  if(!act) return;
  const k = act.dataset.act, p = patById(S.pid);

  if(k==='close-drawer'){ closeDrawer(); return; }
  if(k==='open-guide'){ openGuideModal(); return; }
  if(k==='close-guide'){ $('#guide-host').hidden = true; return; }
  if(k==='guide-pick'){
    $('#guide-host').hidden = true;
    DB.profileRole = act.dataset.role || 'dir';
    saveDB();
    go(act.dataset.go);
    return;
  }

  if(k==='set-profile'){
    const newRole = act.dataset.role;
    DB.profileRole = newRole;
    if(newRole === 'pro' && currentUser().role !== 'pro'){
      DB.activeUserId = (USERS.find(u=>u.role==='pro') || USERS[0]).id;
    }
    saveDB();
    const defaultView = newRole==='sec' ? 'secretaria' : newRole==='pac' ? 'portal' : newRole==='pro' ? 'legajo' : 'tablero';
    go(defaultView);
    toast(`Perfil activo: ${newRole==='pro'?'Profesional Odontólogo':newRole==='sec'?'Secretaría y Recepción':newRole==='pac'?'Portal del Paciente':'Dirección Médica'}`, 'switch_account');
    return;
  }

  if(k==='sim-jump'){
    DB.profileRole = act.dataset.role;
    if(act.dataset.tab) S.tab = act.dataset.tab;
    saveDB();
    go(act.dataset.go);
    return;
  }

  /* Órdenes de Obra Social */
  if(k==='pick-pat-ord'){ S.pid = act.dataset.pid; DB.simPid = S.pid; saveDB(); R.ordenes(); return; }
  if(k==='ord-set-st'){ p.ordenOS.estado = act.dataset.st; saveDB(); R.ordenes(); toast('Estado de la orden actualizado', 'fact_check'); return; }
  if(k==='ord-toggle-chk'){
    const ck = act.dataset.ck;
    p.ordenOS.checks[ck] = !p.ordenOS.checks[ck];
    if(ck==='firma') p.signed = p.ordenOS.checks.firma;
    if(Object.values(p.ordenOS.checks).every(Boolean)) p.ordenOS.estado = 'presentada';
    saveDB(); renderSimBanner(); R.ordenes();
    return;
  }

  /* Recordatorios y Chat */
  if(k==='rec-sub'){ S.recSubTab = act.dataset.k; R.recordatorios(); return; }
  if(k==='ins-var'){
    const ta = $('#wa-tpl-ta');
    if(ta){
      ta.value += ' ' + act.dataset.v;
      DB.waTpl = ta.value;
      saveDB();
      R.recordatorios();
    }
    return;
  }
  if(k==='chat-pick-pat'){ S.pid = act.dataset.pid; DB.simPid = S.pid; saveDB(); R.recordatorios(); return; }
  if(k==='chat-send'){
    const inp = $('#chat-inp');
    if(!inp || !inp.value.trim()) return;
    p.chatMsgs = p.chatMsgs || [];
    p.chatMsgs.push({from:'cli', txt:inp.value.trim(), h:'Ahora'});
    saveDB(); R.recordatorios();
    return;
  }
  if(k==='chat-send-tpl'){
    p.chatMsgs = p.chatMsgs || [];
    p.chatMsgs.push({from:'cli', txt:`Hola ${p.n}! Te recordamos tu turno en Clínica Proyecto Odontología (La Rioja 2173). Confirmá acá: https://proyecto-odon.vercel.app/#confirmar`, h:'Ahora'});
    saveDB(); R.recordatorios();
    toast('Plantilla oficial insertada y enviada al WhatsApp del paciente', 'sms');
    return;
  }

  if(k==='change-pro'){ go('equipo'); return; }
  if(k==='switch-user'){
    DB.activeUserId = act.dataset.uid;
    const u = currentUser();
    DB.profileRole = u.role === 'sec' ? 'sec' : u.role === 'dir' ? 'dir' : 'pro';
    saveDB();
    go('legajo');
    toast(`Ahora operás como ${u.n} (${u.esp})`, 'badge');
    return;
  }

  if(k==='new-user'){ openNewUserModal(); return; }
  if(k==='save-new-user'){
    const n = ($('#nu-n').value||'').trim();
    if(!n){ toast('Escribí el nombre del profesional', 'error'); return; }
    const esp = $('#nu-esp').value, mat = $('#nu-mat').value, silId = +$('#nu-sil').value;

      SILLONES.push({id:silId, n:`Sillón ${silId} · ${esp.split(' ')[0]}`, esp, pro:n, mat, role:'pro', pct:0.60, factBruto:1650000, labDesc:190000});

    DB.activeUserId = nu.id;
    DB.profileRole = 'pro';
    saveDB();
    closeDrawer();

      id:'p'+Date.now(), short:String(PATIENTS.length+1).padStart(2,'0'), n, age, dni:'39.104.'+String(100+PATIENTS.length),
      nac:'10/04/1994', dom:'Mar del Plata', afil:'08-449102-01', tel, os,
      cobPct:OBRAS_LIST[os]??0.7, dent:age<=11?'child':'adult',
      alerts: alerta!=='Ninguna' ? [['bad',alerta]] : [['acc','1.ª Consulta']],
      med:'Sin medicación previa', lab:{st:'ok', item:'1.ª Consulta en Sillón'},
      pano:{fecha:'Pendiente', centro:'Dental Scan · La Rioja 3501', hallazgo:'Orden lista para emitir.'},
      teeth:{}, extraQty:{1:1}, est, pdb:[0,0,0,0,0,0], pdd:[0,0,0,0,0,0],
      recetas:[], implantes:[],
      ordenOS:{nro:'ORD-0000'+(45+PATIENTS.length), estado:'pendiente', mod:'Validación Online', checks:{aut:true, pres:true, rx:false, firma:false}},
      chatMsgs:[{from:'cli', txt:`¡Bienvenido/a ${n} a Clínica Proyecto Odontología! Tu turno ya está agendado.`, h:'Recién'}],
      consentSigned:false, derivaciones:[], signed:false, presuApproved:false, isNew:true

    S.pid = np.id; DB.simPid = np.id;

    return;

  }

  if(k==='pro-reply'){
    const t = TURNOS.find(x=>x.id===act.dataset.tid);
    t.reply = act.dataset.r;
    $('#pings').innerHTML = '';
    if(act.dataset.r === 'voy'){
      DB.profileRole = 'pro';
      S.pid = t.pid;
      saveDB();
      go('legajo');
      toast('Secretaría recibió tu aviso «Ya lo hago pasar» · Ficha abierta', 'check_circle');
    } else {
      saveDB();
      R[S.view]();
      toast('Secretaría recibió tu aviso «Termino en 5 minutos»', 'schedule');
    }
    return;
  }

  if(k==='wa-paciente'){
    const pat = patById(act.dataset.pid || S.pid);
    pat.waReminded = true;
    saveDB();
    R[S.view]();
    toast(`Mensaje de WhatsApp enviado a ${pat.n} (${pat.tel})`, 'sms');
    return;
  }

  if(k==='sec-note-done'){
    const n = SEC_NOTES.find(x=>x.id===act.dataset.id);
    if(n) n.done = true;
    saveDB();
    openNewTurnoModal();
    R.secretaria();
    return;
  }

  if(k==='bolsa-call'){
    const b = BOLSA.find(x=>x.id===act.dataset.id);
    if(b) b.notified = true;
    saveDB();
    R.secretaria();
    toast(`WhatsApp enviado a ${b.n}: hueco de turno ofrecido con éxito`, 'bolt');
    return;
  }

  if(k==='open-implante'){ openImplanteModal(); return; }
  if(k==='save-implante'){
    const u = currentUser(), pza = $('#im-pza').value || '36';
    p.implantes = p.implantes || [];
    p.implantes.unshift({
      pieza:pza, marca:$('#im-mar').value, medida:$('#im-med').value,
      lote:$('#im-lot').value, torque:$('#im-tor').value, fecha:'21/10/2026', pro:`${u.n} (${u.mat})`
    });
    p.extraQty[20] = (p.extraQty[20]||0) + 1;
    p.atendido = true;
    saveDB(); closeDrawer();
    S.tab = 'implantes'; go('legajo');
    toast(`Pasaporte de Implante (Pieza ${pza}) registrado y enviado a la App del paciente`, 'verified');
    return;
  }
  if(k==='sign-consent-now'){
    p.consentSigned = true;
    saveDB(); R.legajo();
    toast('Consentimiento Informado Quirúrgico firmado digitalmente', 'verified_user');
    return;
  }

  /* Recetas Rp/ */
  if(k==='pick-rx'){ S.rxSelIdx = +act.dataset.idx; R.legajo(); return; }
  if(k==='open-receta'){ openRecetaModal(); return; }
  if(k==='save-receta'){
    const u = currentUser();
    p.recetas = p.recetas || [];
    p.recetas.unshift({
      id:'REC-0000'+(20+p.recetas.length), fecha:'21/10/2026',
      pro:u.n, esp:u.esp, mat:u.mat,
      trat:$('#rx-trat').value, droga:$('#rx-droga').value, comp:$('#rx-comp').value,
      dosis:$('#rx-dosis').value, ind:$('#rx-ind').value
    });
    S.rxSelIdx = 0;
    p.med = $('#rx-droga').value + ' · ' + $('#rx-dosis').value;
    p.atendido = true;
    saveDB(); closeDrawer();
    S.tab = 'recetas'; go('legajo');
    toast('Receta oficial Rp/ generada y enviada al Portal del Paciente', 'prescriptions');
    return;
  }
  if(k==='quick-rx'){
    const c = RECETAS_COMBOS.find(x=>x.id===act.dataset.rxid), u = currentUser();
    p.recetas = p.recetas || [];
    p.recetas.unshift({
      id:'REC-0000'+(20+p.recetas.length), fecha:'21/10/2026',
      pro:u.n, esp:u.esp, mat:u.mat,
      trat:'Atención clínica en sillón', droga:c.droga, comp:c.comp, dosis:c.dosis, ind:c.ind
    });
    S.rxSelIdx = 0;
    p.med = c.droga;
    p.atendido = true;
    saveDB(); R.legajo();
    toast(`Receta Rp/ de ${c.droga} generada con firma digital`, 'prescriptions');
    return;
  }

  if(k==='open-derivar'){ openDerivarModal(); return; }
  if(k==='save-derivar'){
    const u = currentUser(), para = $('#dv-para').value, mot = $('#dv-mot').value;
    p.derivaciones = p.derivaciones || [];
    p.derivaciones.unshift({fecha:'Hoy', de:`${u.n} (${u.esp.split(' ')[0]})`, para, motivo:mot, estado:'Enviado a Secretaría'});
    SEC_NOTES.unshift({id:'ns'+Date.now(), pid:p.id, de:`${u.n} (${u.esp.split(' ')[0]})`, txt:`Derivar a ${para}: ${mot}`, done:false});
    saveDB(); closeDrawer(); R.legajo();
    toast('Pase clínico registrado · Secretaría ya lo tiene en su consola de turnos', 'alt_route');
    return;
  }

  if(k==='pac-confirm-turno'){
    const t = TURNOS.find(x=>x.id===act.dataset.tid);
    if(t) t.confirmed = true;
    saveDB(); R.portal();
    toast('Turno confirmado. Secretaría ya lo ve confirmado en la agenda.', 'check_circle');
    return;
  }
  if(k==='pac-toggle-reprog' || k==='reprog-sec'){
    if(k==='reprog-sec'){
      const t = TURNOS.find(x=>x.id===act.dataset.tid);
      if(t){ t.dia = 'Jueves 22 oct'; t.h = '16:00'; saveDB(); R.secretaria(); toast('Turno reprogramado para el Jueves 22 a las 16:00 hs y avisado al paciente', 'edit_calendar'); }
      return;
    }
    S.showReprog = !S.showReprog; R.portal(); return;
  }
  if(k==='pac-pick-slot'){
    const t = TURNOS.find(x=>x.id===act.dataset.tid);
    const [dia, h] = act.dataset.slot.split(' · ');
    if(t){ t.dia = dia; t.h = h; t.confirmed = true; }
    S.showReprog = false;
    saveDB(); R.portal();
    toast(`Tu turno se cambió al ${dia} a las ${h} hs. Se actualizó la agenda del consultorio.`, 'event_repeat');
    return;
  }
  if(k==='pac-dl-rx'){ DB.profileRole='pro'; S.tab='recetas'; saveDB(); go('legajo'); toast('Abriendo hoja oficial Rp/ lista para imprimir o presentar en farmacia', 'description'); return; }

  if(k==='reset-demo'){
    localStorage.removeItem(DB_KEY);
    DB = loadDB();
    SILLONES = DB.sillones; USERS = DB.users; PATIENTS = DB.patients; TURNOS = DB.turnos; SEC_NOTES = DB.notasSec; BOLSA = DB.bolsaUrg; COBERTURAS = DB.coberturas;
    S.pid = 'p1';
    go('legajo');
    toast('Datos restaurados a la configuración inicial', 'restart_alt');
    return;
  }

  if(k==='pick-pat' || k==='open-pat'){ S.pid = act.dataset.pid; DB.simPid = S.pid; saveDB(); go('legajo'); }
  if(k==='tab'){ S.tab = act.dataset.t; R.legajo(); }
  if(k==='tool'){ S.tool = act.dataset.t; R.legajo(); }
  if(k==='dent'){ p.dent = act.dataset.d; saveDB(); R.legajo(); }
  if(k==='pqty'){
    const id = +act.dataset.id, d = +act.dataset.d;
    p.extraQty[id] = Math.max(0, (p.extraQty[id]||0) + d);
    p.atendido = true; saveDB(); renderSimBanner(); R.legajo();
  }
  if(k==='est-toggle'){
    const sk = act.dataset.k, st = p.est[sk];
    st.ok = !st.ok;
    if(!st.ok && !st.obs) st.obs = EST_STRUCTS.find(x=>x.k===sk).sug;
    p.atendido = true; saveDB(); R.legajo();
  }
  if(k==='ihos'){ p[act.dataset.t][+act.dataset.i] = +act.dataset.v; p.atendido = true; saveDB(); R.legajo(); }
  if(k==='add-destartraje'){ p.extraQty[2] = (p.extraQty[2]||0) + 1; saveDB(); S.tab = 'odonto'; go('legajo'); toast('Destartraje sumado al presupuesto', 'add_task'); }
  if(k==='send-presu'){ DB.profileRole = 'pac'; saveDB(); go('portal'); toast('Cambiando a Vista Paciente para aprobar el presupuesto en el celular', 'smartphone'); }
  if(k==='orden-dentalscan'){
    p.pano.fecha = 'Orden enviada hoy (21/10/2026)';
    if(p.ordenOS) p.ordenOS.checks.rx = true;
    saveDB(); R.legajo();
    toast('Orden digital enviada para Dental Scan (La Rioja 3501)', 'radiology');
  }
  if(k==='voice-demo'){ S.voiceDone = true; R.manoslibres(); }
  if(k==='voice-apply'){
    const u = currentUser();
    p.teeth['17'] = {faces:{M:'caries',O:'caries'}, whole:null, by:`${u.n} · IA Voz`};
    p.recetas.unshift({id:'REC-0000'+(20+p.recetas.length), fecha:'21/10/2026', pro:u.n, esp:u.esp, mat:u.mat, trat:'Resina compuesta pieza 17', droga:'Ketorolac 10 mg Sublingual', comp:'Envase × 10 comprimidos', dosis:'1 comprimido sublingual cada 8 hs si hay dolor', ind:'Generado por dictado manos libres con IA.'});
    p.atendido = true; saveDB(); S.tab = 'odonto'; go('legajo');
    toast('IA impactó Pieza 17 en el Odontograma, en la Planilla OS y creó la Receta Rp/', 'auto_awesome');
  }
  if(k==='foto-planilla'){ p.extraQty[18] = (p.extraQty[18]||0) + 2; saveDB(); S.tab = 'odonto'; go('legajo'); toast('Planilla leída: se sumaron 2 Sellantes al presupuesto', 'document_scanner'); }
  if(k==='firmar-ok'){
    p.signed = true; p.consentSigned = true;
    if(p.ordenOS){ p.ordenOS.checks.firma = true; p.ordenOS.estado = 'presentada'; }
    DB.profileRole = 'sec'; saveDB(); go('ordenes');
    toast('Firma estampada · Mirá cómo quedó en la Planilla Oficial de Obra Social', 'verified');
  }
  if(k==='approve-presu'){ p.presuApproved = true; saveDB(); go('firmas'); toast('Plan aprobado · Pasando a Firma de Planilla Oficial', 'check_circle'); }
  if(k==='urgencia'){ toast('Solicitud de sobreturno de urgencia enviada a la Consola de Secretaría', 'emergency'); }
});

document.addEventListener('change', e => {
  if(e.target.dataset.act === 'pac-switch-sel'){
    S.pid = e.target.value; DB.simPid = S.pid; saveDB(); go('portal');
  }
  if(e.target.id === 'cov-prac-sel'){
    S.covPracId = +e.target.value; R.coberturas();
  }
  if(e.target.dataset.covModo !== undefined){
    const idx = +e.target.dataset.covModo;
    COBERTURAS[idx].modo = e.target.value;
    COBERTURAS[idx].val = e.target.value === 'pct' ? 70 : 45000;
    saveDB(); R.coberturas();
  }
});

document.addEventListener('input', e => {
  if(e.target.dataset.estInp){
    patById(S.pid).est[e.target.dataset.estInp].obs = e.target.value;
    saveDB();
  }
  if(e.target.id === 'wa-tpl-ta'){
    DB.waTpl = e.target.value;
    saveDB();
    const box = $('.wa-bubble');
    if(box){ R.recordatorios(); $('#wa-tpl-ta').focus(); }
  }
  if(e.target.dataset.covVal !== undefined){
    const idx = +e.target.dataset.covVal;
    COBERTURAS[idx].val = +e.target.value || 0;
    saveDB(); R.coberturas();
  }
});

go('legajo');
</script>
</body>
</html>
